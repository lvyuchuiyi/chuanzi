<script>
// ENGINE START
const Engine = (() => {
  let D = null;
  // Content packs: retorts are indexed once so replies can be referenced by id
  let RX = {};
  const init = (data) => {
    D = data; RX = {};
    for (const [topic, byLv] of Object.entries(D.retorts || {}))
      for (const [lv, sides] of Object.entries(byLv))
        sides.forEach((lines, si) => lines.forEach((text, i) => { const id = `t:${topic}:${lv}:${si}:${i}`; RX[id] = { id, topic, lvl: Number(lv), side: si === 0 ? 1 : -1, text, gen: true }; }));
    for (const [mode, lines] of Object.entries(D.keep || {}))
      lines.forEach((text, i) => { const id = `k:${mode}:${i}`; RX[id] = { id, mode, tech: mode, text, keep: true, gen: true }; });
  };
  const npcDef = (id) => D.npcs.find(n => n.id === id);
  const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
  const sign = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  function rand(s) {
    s.rng = (s.rng + 0x6D2B79F5) >>> 0;
    let t = s.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const pick = (s, arr) => arr[Math.floor(rand(s) * arr.length) % arr.length];

  function newGame(seed) {
    const s = {
      seed: seed >>> 0, rng: seed >>> 0, turn: 1,
      ap: D.level.ap, claims: [], nextId: 1,
      npcs: D.npcs.map(n => ({ id: n.id, stance: n.stance, clues: { main: 0, alt: 0 }, read: {}, researched: false, involved: false, left: false, privateQ: [], lastLine: '' })),
      accounts: D.accounts.map(a => ({ id: a.id, circles: a.circles.slice(), exposed: false, mascot: false, calledOut: false, lastStance: null, posts: 0 })),
      circles: D.circles.map(c => ({ id: c.id, locked: !!c.locked, fam: 0, remix: 0, crowdView: 0 })),
      log: [], turnPosts: {}, timeCorr: [], pendingCallouts: [],
      flags: { streamed: false, streamTurn: null, officialUnlocked: false, decision: null, dataBranch: null, memeBorn: null, carriedRoots: [] },
      remixStep: -1, publicPosts: 0, stageLit: [false, false, false, false, false, false],
      sus: { main: 0, alt: 0 }, duelsThisTurn: 0, over: false, ending: null, costs: [], mascotFlag: false, stigma: 0, overreadQ: [], war: 0,
      events: [], fx: [], news: null, grudge: {}, nemesis: null
    };
    scheduleEvents(s);
    return s;
  }

  // ---------- Hourly events (from the pack's event list) ----------
  function scheduleEvents(s) {
    const pool = (D.events || []).slice(), out = [], used = new Set();
    const n = Math.min(D.level.eventsPerRun || 0, pool.length);
    let guard = 0;
    while (out.length < n && pool.length && guard++ < 50) {
      const tot = pool.reduce((a, e) => a + (e.weight || 1), 0);
      let r = rand(s) * tot, i = 0;
      for (; i < pool.length - 1; i++) { r -= pool[i].weight || 1; if (r <= 0) break; }
      const e = pool.splice(i, 1)[0];
      const [lo, hi] = e.turns || [3, D.level.turns - 1];
      const cand = []; for (let t = lo; t <= hi; t++) if (!used.has(t)) cand.push(t);
      if (!cand.length) continue;
      const t = cand[Math.floor(rand(s) * cand.length)]; used.add(t);
      out.push({ id: e.id, turn: t });
    }
    s.events = out.sort((a, b) => a.turn - b.turn);
  }
  const evDef = (id) => (D.events || []).find(e => e.id === id);
  const fxActive = (s, t) => (s.fx || []).filter(f => f.t === t && f.until >= s.turn);
  const fxMult = (s, t) => fxActive(s, t).reduce((a, f) => a * (f.mult || 1), 1);
  const fxAdd = (s, t) => fxActive(s, t).reduce((a, f) => a + (f.add || 0), 0);
  const fxOn = (s, t, accId) => fxActive(s, t).some(f => !accId || !f.acc || f.acc === accId);
  function gainWar(s, n) { s.war += n; const m = fxMult(s, 'war'); if (m > 1 && rand(s) < (m - 1) * n) s.war += 1; }
  function startHour(s) {
    for (const ev of s.events.filter(x => x.turn === s.turn)) {
      const e = evDef(ev.id); if (!e) continue;
      const until = s.turn + (e.dur || 1) - 1;
      s.news = { id: e.id, turn: s.turn, until };
      for (const f of e.fx || []) {
        if (['war', 'act', 'perc', 'noLock', 'mute'].includes(f.t)) s.fx.push(Object.assign({ until }, f));
        else if (f.t === 'ap') s.ap += f.add || 1;
        else if (f.t === 'fuelHalve') s.claims.forEach(c => { if (c.fuel > 0) c.fuel = Math.floor(c.fuel / 2); });
        else if (f.t === 'spawn') {
          const v = f.variants ? pick(s, f.variants) : f;
          const c = makeClaim(s, { circle: f.circle || 'bar', core: v.text, text: v.text, stance: v.stance || 0, ext: v.ext || 1, tone: 'sincere', heat: f.heat || 4, author: { type: 'npc', id: f.npc } });
          c.fuel = f.fuel || 3; c.event = e.id;
        } else if (f.t === 'susRecent') {
          for (const a of s.accounts) if (s.claims.some(c => c.author.type === 'acc' && c.author.id === a.id && c.turn >= s.turn - 1)) addClue(s, npc(s, 'c_spot'), a.id, f.add || 1, f.why || '最近说过话', false);
        }
      }
      log(s, 'news', e.text);
    }
  }

  // ---------- Nemesis: a netizen you've fought too often follows you around ----------
  function grudgeUp(s, npcId, accId) {
    const def = npcDef(npcId); if (!def || !['fan', 'rival', 'hater'].includes(def.arch)) return;
    const k = npcId + '|' + accId; s.grudge[k] = (s.grudge[k] || 0) + 1;
  }
  function nemesisStep(s) {
    if (!s.nemesis) {
      const top = Object.entries(s.grudge).filter(([, v]) => v >= 3).sort((a, b) => b[1] - a[1])[0];
      if (top) {
        const [id, accId] = top[0].split('|');
        if (!acc(s, accId).exposed) {
          s.nemesis = { id, acc: accId, since: s.turn, idle: 0 };
          log(s, 'event', `「${npcDef(id).name}」跟你的${accId === 'main' ? '主号' : '小号'}吵了好几回，记住你了。他成了你的宿敌。`, id);
        }
      }
      return;
    }
    const ne = s.nemesis, n = npc(s, ne.id);
    const mine = s.claims.filter(c => c.author.type === 'acc' && c.author.id === ne.acc && c.turn === s.turn && !rootLocked(s, c.root) && c.kind === 'guogai');
    if (!mine.length) {
      ne.idle++;
      if (ne.idle >= 2) { log(s, 'event', `「${npcDef(ne.id).name}」两个小时没找到你，没兴趣了。`, ne.id); s.grudge[ne.id + '|' + ne.acc] = 0; s.nemesis = null; }
      return;
    }
    ne.idle = 0;
    const t = mine[mine.length - 1];
    const k = ne.id + '|' + ne.acc; s.grudge[k] = (s.grudge[k] || 0) + 1;
    const digging = s.grudge[k] >= 5;
    const line = fmt(pickT(s, D.talk.nemesis[digging && rand(s) < 0.5 ? 'dig' : 'follow']), t, s);
    const c = npcReply(s, n, t, line, sign(n.stance) * 2, { crowd: true, duel: true, lvl: 2 });
    c.nemesis = true; n.involved = true;
    claim(s, t.root).fuel += 2; claim(s, t.root).fight++;
    gainWar(s, 1);
    if (digging) addClue(s, n, ne.acc, 1, '被宿敌翻了主页', false);
    log(s, 'crowd', `${npcDef(ne.id).name}（宿敌）：${line}`, ne.id);
  }

  const acc = (s, id) => s.accounts.find(a => a.id === id);
  const npc = (s, id) => s.npcs.find(n => n.id === id);
  const circ = (s, id) => s.circles.find(c => c.id === id);
  const claim = (s, id) => s.claims.find(c => c.id === id);
  const circleName = (id) => D.circles.find(c => c.id === id).name;
  const accName = (id) => D.accounts.find(a => a.id === id).name;

  function log(s, kind, text, who) { s.log.push({ turn: s.turn, kind, text, who: who || null }); }

  function threadHeat(s, root) { return s.claims.filter(c => c.root === root).reduce((a, c) => a + c.heat, 0); }
  function rootLocked(s, root) { const r = claim(s, root); return r ? !!r.locked : false; }
  function guogaiRoots(s, circleId) {
    return s.claims.filter(c => c.id === c.root && c.kind === 'guogai' && (!circleId || c.circle === circleId));
  }
  function maxThreadHeat(s) { return guogaiRoots(s).reduce((m, r) => Math.max(m, threadHeat(s, r.id)), 0); }
  function bump(s, c, n) {
    if (!c || rootLocked(s, c.root)) return;
    c.heat += n;
  }

  function makeClaim(s, p) {
    const id = s.nextId++;
    const parent = p.parent ? claim(s, p.parent) : null;
    const c = {
      id, turn: s.turn, circle: p.circle, kind: p.kind || 'guogai',
      author: p.author, core: p.core || '', text: p.text,
      stance: p.stance || 0, ext: p.ext || 0, tone: p.tone || 'sincere',
      signalMod: p.signalMod || 0, meme: !!p.meme, data: !!p.data,
      parent: parent ? parent.id : null, root: parent ? parent.root : id,
      heat: p.heat == null ? (parent ? 0 : 1) : p.heat, readings: {}, locked: false,
      flagNewExtreme: !!p.flagNewExtreme, contradiction: !!p.contradiction, flagSpam: !!p.flagSpam, flagFuel: !!p.flagFuel,
      target: p.target || null, remixed: !!p.remixed, lacai: !!p.lacai, crowd: !!p.crowd, overread: false, duel: !!p.duel, lvl: p.lvl || 0, fight: 0, fuel: 0
    };
    s.claims.push(c);
    if (parent) bump(s, parent, 1);
    if (c.meme && s.flags.memeBorn) {
      const cc = circ(s, c.circle);
      if (cc.fam < 1) cc.fam = 1;
    }
    return c;
  }

  const authorName = (c) => c.author.type === 'acc' ? accName(c.author.id) : npcDef(c.author.id).name;
  const quoteOf = (c) => { const t = (c.core || c.text || '').replace(/^【.*?】/, '').replace(/^@\S+\s/, '').replace(D.lines.agen_carry, ''); return t.length > 12 ? t.slice(0, 12) + '…' : t; };
  const fmt = (line, t, st, ex) => { const qs = st && t && t.parent != null && t.author.type === 'npc' && (t.text.includes('「') || quoteOf(t).length < 6) ? claim(st, t.root) : t;
    let out = line.replace(/\{who\}/g, t ? authorName(t) : '').replace(/\{q\}/g, qs ? quoteOf(qs) : '');
    if (ex && ex.who2) out = out.replace(/\{who2\}/g, authorName(ex.who2));
    if (out.includes('{kw}')) out = out.replace(/\{kw\}/g, (ex && ex.kw) || (t ? quoteOf(t).slice(0, 4) : ''));
    return out; };
  // ---------- NPC lines that read what they reply to ----------
  const NT = () => D.npcTalk || {};
  function kwOf(text) { for (const t of Object.values(D.topics || {})) { const k = t.kw.find(w => text.includes(w)); if (k) return k; } return ''; }
  function topicFor(s, t) { let tags = topicsOf(t.text); if (!tags.length && t.root != null) tags = topicsOf(claim(s, t.root).text); return tags.length ? tags[Math.floor(rand(s) * tags.length)] : 'generic'; }
  const stripAt = (x) => x.replace(/^@\{who\}\s*/, '');
  // mode: 'hit' (attack t at lvl) | 'back' (side with t). Mixes topic pools with the archetype's own voice.
  function npcLine(s, def, mode, t, lvl, fallback) {
    const n = npc(s, def.id), side = sign(n.stance) || 1, si = side > 0 ? 0 : 1;
    const topic = topicFor(s, t);
    let line = null;
    if (mode === 'hit') {
      const pool = NT().npcRetorts && NT().npcRetorts[topic] && NT().npcRetorts[topic][String(lvl)] && NT().npcRetorts[topic][String(lvl)][si];
      if (pool && pool.length && rand(s) < 0.6) line = pickT(s, pool);
    } else if (mode === 'back') {
      const pool = NT().npcBack && NT().npcBack[topic] && NT().npcBack[topic][si];
      if (pool && pool.length && rand(s) < 0.6) line = pickT(s, pool);
    }
    if (!line && fallback) line = pickT(s, fallback);
    if (!line) return null;
    // openers: an old foe ("又是你？") or the exact word the player used ("「缝合」？")
    if (mode === 'hit' && /^@\{who\}/.test(line)) {
      const foe = t.author.type === 'npc' && (s.ng || {})[def.id + '|' + t.author.id] >= 2;
      const kw = t.author.type === 'acc' ? kwOf(t.text) : '';
      if (foe && NT().rematch && rand(s) < 0.6) line = pickT(s, NT().rematch) + stripAt(line);
      else if (kw && NT().kwOpen && rand(s) < 0.45 && !line.includes('{q}')) line = pickT(s, NT().kwOpen) + stripAt(line);
      const dec = NT().decor && NT().decor[String(lvl)];
      if (dec && rand(s) < 0.4 && !/[？?！!）」]$/.test(line)) line = line.replace(/[。]$/, '') + pickT(s, dec);
    }
    return fmt(line, t, s, { kw: kwOf(t.text) });
  }
  const pickT = (s, pool) => { s.usedT = s.usedT || {}; const fresh = pool.filter(x => !s.usedT[x]); const x = pick(s, fresh.length ? fresh : pool); s.usedT[x] = 1; return x; };
  const talk = (arch, sit) => (D.talk[arch] && D.talk[arch][sit]) || null;
  const postLine = (id) => D.posts.find(l => l.id === id);
  const replyLine = (id) => {
    const r = RX[id]; if (!r) return D.replies.find(l => l.id === id);
    return r.keep ? r : Object.assign({ mode: 'side', tech: r.lvl >= 3 ? 'bait' : 'sincere' }, r);
  };
  // which topics a comment is about (from the pack's keyword lists)
  function topicsOf(text) {
    const out = [];
    for (const [k, t] of Object.entries(D.topics || {})) if (t.kw.some(w => text.includes(w))) out.push(k);
    return out;
  }
  const hash = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  // A hand of reply cards for one target: back him up, hit back, hit harder, or just stir.
  // Deterministic per (target, hour, account, reroll) so it never reshuffles under the player.
  function replyHand(s, targetId, accId, reroll) {
    const t = claim(s, targetId); if (!t) return [];
    let seed = hash(`${s.seed}|${t.id}|${s.turn}|${accId}|${reroll || 0}`);
    const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let x = seed; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
    const pickOne = (arr) => arr[Math.floor(rnd() * arr.length)];
    const root = claim(s, t.root);
    let tags = topicsOf(t.text); if (!tags.length) tags = topicsOf(root.text);
    const topic = tags.length ? pickOne(tags) : 'generic';
    const side = sign(t.stance) || sign(root.stance) || (rnd() < 0.5 ? 1 : -1);
    const lv = Math.max(1, Math.min(3, t.lvl || 1));
    const card = (kind, sd, l, tp) => {
      tp = tp || topic;
      let pool = Object.values(RX).filter(r => !r.keep && r.topic === tp && r.side === sd && r.lvl === l);
      if (!pool.length) pool = Object.values(RX).filter(r => !r.keep && r.topic === 'generic' && r.side === sd && r.lvl === l);
      const r = pickOne(pool); return r ? { kind, id: r.id, side: sd, lvl: l, topic: r.topic } : null;
    };
    const keep = () => { const all = Object.values(RX).filter(r => r.keep && (r.mode !== 'overread' || !t.overread)); const r = pickOne(all); return r ? { kind: 'keep', id: r.id, mode: r.mode } : null; };
    let hand;
    if (t.kind === 'callout') hand = [keep(), keep(), keep()];
    else {
      const other = tags.filter(x => x !== topic);
      hand = [card('back', side, lv), card('hit', -side, lv), lv < 3 ? card('up', -side, lv + 1) : card('angle', -side, 2, other.length ? pickOne(other) : 'generic'), keep()];
    }
    const seen = new Set();
    return hand.filter(h => h && !seen.has(h.id) && seen.add(h.id)).map(h => Object.assign(h, { text: fmt(RX[h.id].text, t, s), topicName: D.topics[h.topic] ? D.topics[h.topic].name : '' }));
  }

  // Signal of a claim as read in a given circle
  function signalOf(s, c) {
    let base = D.techs[c.tone].signal + (c.ext >= 2 ? 1 : 0) + c.signalMod + (c.overread ? 2 : 0);
    const cc = circ(s, c.circle);
    if (c.kind === 'guogai' && s.flags.memeBorn && c.meme) base += cc.fam >= 2 ? 3 : cc.fam === 1 ? 1 : 0;
    if (c.author.type === 'acc') {
      const a = acc(s, c.author.id);
      const def = D.accounts.find(x => x.id === a.id);
      if (a.exposed) return { base, forced: 'I', note: '公认串子' };
      if (def.persona === 'sincere') base -= 1;
    }
    return { base, forced: null };
  }

  function decode(s, perception, stance, c) {
    const sig = signalOf(s, c);
    if (sig.forced) return { val: null, res: sig.forced, sig, bias: 0, note: sig.note };
    const bias = (stance > 0 && c.stance > 0) || (stance < 0 && c.stance < 0) ? 1 : 0;
    const val = Math.max(0, perception + fxAdd(s, 'perc')) + sig.base - bias;
    const res = val >= 5 ? 'I' : val <= 3 ? 'L' : 'U';
    return { val, res, sig, bias };
  }
  function resolve(s, res, preview) {
    if (res !== 'U') return res;
    return preview ? 'L' : (rand(s) < 0.5 ? 'I' : 'L');
  }
  const meaning = (c, res) => (res === 'I' ? -c.stance : c.stance);

  function addClue(s, n, accId, k, why, preview) {
    const a = acc(s, accId);
    if (!a || a.exposed) return;
    n.clues[accId] = (n.clues[accId] || 0) + k;
    if (!preview) {
      s.sus = s.sus || {}; s.susSeen = s.susSeen || {};
      const key = `${s.turn}|${accId}|${why}`;
      if (!s.susSeen[key]) { s.susSeen[key] = 1; s.sus[accId] = (s.sus[accId] || 0) + k; s.susMax = Math.max(s.susMax || 0, s.sus[accId]); }
    }
    if (!preview) log(s, 'clue', `${npcDef(n.id).name}记下一条线索：${accName(accId)}${why}`, n.id);
  }

  // ---------- Player actions ----------
  function canPost(s, accId, circleId) {
    const a = acc(s, accId);
    const c = circ(s, circleId);
    if (!a || !c) return false;
    if (circleId === 'official') return s.flags.officialUnlocked;
    return a.circles.includes(circleId);
  }

  function noteTurnPost(s, accId, root) {
    s.turnPosts[root] = s.turnPosts[root] || [];
    if (!s.turnPosts[root].includes(accId)) s.turnPosts[root].push(accId);
    if (s.turnPosts[root].length >= 2 && !s.timeCorr.includes(root)) s.timeCorr.push(root);
  }

  function playerPostProps(s, a, stance, ext) {
    const props = {};
    if (a.lastStance != null && sign(a.lastStance) !== 0 && sign(stance) !== 0 && sign(a.lastStance) !== sign(stance)) props.contradiction = true;
    if (a.id === 'alt' && ext >= 2 && s.turn <= 4) props.flagNewExtreme = true;
    s.turnCount = s.turnCount || {};
    if ((s.turnCount[a.id] || 0) >= 1) props.flagSpam = true;
    s.turnCount[a.id] = (s.turnCount[a.id] || 0) + 1;
    a.lastStance = stance;
    a.posts++;
    return props;
  }

  function draftClaim(s, act) {
    // Returns the props a player action would create (no mutation), or {error}
    const a = acc(s, act.acc);
    if (!a) return { error: '选一个账号' };
    if (act.type === 'post') {
      const l = postLine(act.line);
      if (!l) return { error: '选一句话' };
      if (l.tech === 'meme' && !s.flags.memeBorn) return { error: '还没有梗可以玩，先让大家二创几轮' };
      if (!canPost(s, a.id, act.circle)) return { error: `${accName(a.id)}不在${circleName(act.circle)}` };
      return { circle: act.circle, core: l.text, text: l.text, stance: l.stance, ext: l.ext, tone: l.tech, meme: l.tech === 'meme', data: !!l.data, lacai: !!l.lacai, author: { type: 'acc', id: a.id } };
    }
    if (act.type === 'reply') {
      const p = claim(s, act.target);
      if (!p) return { error: '先点选一条评论' };
      if (p.kind !== 'guogai' && p.kind !== 'callout') return { error: D.lines.not_topic };
      if (p.kind === 'callout' && act.line && replyLine(act.line) && !['overread', 'mock', 'fuel'].includes(replyLine(act.line).mode)) return { error: '回挂人评论只能用「懂你意思」「阴阳」或「起哄」，把它搅成玩梗' };
      if (rootLocked(s, p.root)) return { error: '这个串已经被锁了' };
      if (!canPost(s, a.id, p.circle)) return { error: `${accName(a.id)}不在${circleName(p.circle)}` };
      const l = replyLine(act.line);
      if (!l) return { error: '选一句回复' };
      if (l.mode === 'rebut' && l.vs !== 'any' && ((l.vs === 'pro' && p.stance <= 0) || (l.vs === 'anti' && p.stance >= 0))) return { error: l.vs === 'pro' ? D.lines.reply_vs_pro : D.lines.reply_vs_anti };
      if (l.mode === 'overread' && p.overread) return { error: '这条已经被强行解读过了' };
      let text = l.gen ? fmt(l.text, p, s) : l.text, stance = 0, ext = l.ext || 0, remixed = false, meme = false, tone = l.tech;
      if (l.mode === 'side') { stance = l.side * 2; ext = l.lvl >= 3 ? 2 : l.lvl - 1; }
      else if (l.mode === 'agree') { stance = p.stance; meme = p.meme; }
      else if (l.mode === 'rebut') { stance = -sign(p.stance || 1) * 2; }
      else if (l.mode === 'mock') { stance = -sign(p.stance || 1) * 2; }
      else if (l.mode === 'remix') { const step = Math.min(s.remixStep + 1, D.remix.length - 1); text = D.remix[step]; stance = 2; ext = 2; remixed = true; meme = step >= 1; }
      return { circle: p.circle, parent: p.id, core: text, text, stance, ext, tone, meme, remixed, lvl: l.lvl || 0, fuel: l.mode === 'fuel', overread: l.mode === 'overread', summon: l.summon || null, author: { type: 'acc', id: a.id } };
    }
    if (act.type === 'carry') {
      const p = claim(s, act.target);
      if (!p) return { error: '选一条要搬运的评论' };
      if (p.kind !== 'guogai') return { error: D.lines.not_topic.replace('回复', '搬运') };
      if (!act.circle || act.circle === p.circle) return { error: '选另一个圈子' };
      if (!canPost(s, a.id, act.circle)) return { error: `${accName(a.id)}不在${circleName(act.circle)}` };
      const core = p.core || p.text;
      return { circle: act.circle, core, text: `【截图搬运】${p.text}`, stance: p.stance, ext: p.ext, tone: p.tone, signalMod: p.signalMod - 2, meme: p.meme, author: { type: 'acc', id: a.id }, carriedFrom: p.id };
    }
    return { error: '未知动作' };
  }

  function applyPlayer(s, act) {
    if (s.over) return { error: '本局已结束' };
    if (s.ap < 1) return { error: '行动力用完了，点「下一小时」' };
    const a = acc(s, act.acc);
    if (act.type === 'join') {
      const def = D.accounts.find(x => x.id === act.acc);
      if (!def.canJoin || !def.canJoin.includes('qun')) return { error: '这个账号不能入群' };
      if (a.circles.includes('qun')) return { error: '已经在群里了' };
      a.circles.push('qun'); s.ap--;
      log(s, 'player', `${accName(a.id)}加入了萌新互助群。`);
      return { ok: true };
    }
    if (act.type === 'dm') {
      const n = npc(s, act.npc); const p = claim(s, act.target);
      if (!n || act.npc === 'xiaowang') return { error: '选一个可以私信的人' };
      if (!p || p.kind !== 'guogai') return { error: '选一条' + D.vocab.topic + '相关的评论发给他' };
      if (!a) return { error: '选一个账号' };
      n.privateQ.push({ claim: p.id, acc: a.id });
      s.ap--;
      log(s, 'player', `${accName(a.id)}私信${npcDef(n.id).name}：“你看看这个”——${p.text}`);
      return { ok: true };
    }
    if (['post', 'reply', 'carry'].includes(act.type) && fxOn(s, 'mute', a.id) && fxActive(s, 'mute').some(f => f.acc === a.id)) return { error: '平台风控：这个号的评论正在审核，这一小时发不出去' };
    const d = draftClaim(s, act);
    if (d.error) return d;
    // the same move over and over gets you recognised: easier to see through, and noted
    const mv = act.type === 'reply' ? 'r:' + (replyLine(act.line).mode === 'side' ? (sign(d.stance) === sign((claim(s, act.target) || {}).stance) ? 'agree' : 'rebut') : replyLine(act.line).mode) : act.type === 'post' ? 'p:' + postLine(act.line).tech : 'c';
    s.habit = s.habit || {}; s.habit[a.id] = s.habit[a.id] || {};
    const used = (s.habit[a.id][mv] || 0) + 1; s.habit[a.id][mv] = used;
    if (used >= 3) d.signalMod = (d.signalMod || 0) + Math.min(2, used - 2);
    const extra = playerPostProps(s, a, d.stance, d.ext);
    const c = makeClaim(s, Object.assign({}, d, extra, { flagFuel: !!d.fuel }));
    if (d.fuel) bump(s, claim(s, c.root), 1);
    if (d.summon) { const sn = npc(s, d.summon); if (sn) sn.privateQ.push({ claim: d.parent, acc: a.id, open: true }); }
    if (d.overread) {
      const t = claim(s, d.parent);
      t.overread = true; bump(s, claim(s, t.root), 1);
      if (t.author.type === 'npc') s.overreadQ.push(t.id);
    }
    if (d.remixed) { s.remixStep = Math.min(s.remixStep + 1, D.remix.length - 1); circ(s, c.circle).remix++; }
    if (d.carriedFrom != null) {
      const src = claim(s, d.carriedFrom);
      if (src.meme && s.flags.memeBorn) { const cc = circ(s, c.circle); cc.fam = Math.min(3, cc.fam + 1); }
    }
    s.publicPosts++; s.ap--;
    noteTurnPost(s, a.id, c.root);
    c.move = mv;
    const spotN = npc(s, 'c_spot');
    if (used >= 3 && spotN) addClue(s, spotN, a.id, 1, `老用同一套路数（第 ${used} 次）`, false);
    const inThread = s.claims.filter(x => x.root === c.root && x.author.type === 'acc' && x.author.id === a.id).length;
    if (inThread >= 4 && spotN) addClue(s, spotN, a.id, 1, `在同一楼里已经说了 ${inThread} 句`, false);
    if (c.circle === 'official') {
      a.officialPosts = (a.officialPosts || 0) + 1;
      if (a.officialPosts >= 2) addClue(s, npc(s, 'c_spot'), a.id, 1, `在官方动态底下已经刷了 ${a.officialPosts} 条`, false);
    }
    const verb = act.type === 'post' ? '评论' : act.type === 'reply' ? '回复' : '搬运';
    log(s, 'player', `${accName(a.id)}在${circleName(c.circle)}${verb}：${c.text}`);
    return { ok: true, claim: c.id };
  }

  // ---------- NPC phase ----------
  function npcReply(s, n, target, core, stance, opts) {
    const def = npcDef(n.id);
    const c = makeClaim(s, Object.assign({ circle: target.circle, parent: target.id, core, text: core, stance, ext: 0, tone: 'sincere', author: { type: 'npc', id: n.id } }, opts || {}));
    return c;
  }

  function readQueue(s, n, preview) {
    const def = npcDef(n.id);
    const out = [];
    while (n.privateQ.length) {
      const q = n.privateQ.shift();
      const c = claim(s, q.claim);
      if (c) out.push({ c, priv: q.open ? null : q.acc, summoned: !!q.open });
    }
    const pool = s.claims.filter(c =>
      (c.kind === 'guogai') && def.circles.includes(c.circle) && !n.read[c.id] &&
      !(c.author.type === 'npc' && c.author.id === n.id) && !rootLocked(s, c.root) &&
      !(c.author.type === 'npc' && c.parent != null) &&
      !(c.circle === 'official' && !s.flags.officialUnlocked)
    ).sort((a, b) => threadHeat(s, b.root) - threadHeat(s, a.root) || b.heat - a.heat || b.id - a.id);
    for (const c of pool) { if (out.length >= 3) break; if (!out.find(o => o.c.id === c.id)) out.push({ c, priv: null }); }
    return out;
  }

  function readOne(s, n, item, preview) {
    const def = npcDef(n.id);
    const c = item.c;
    const d = decode(s, def.perception, n.stance, c);
    const res = resolve(s, d.res, preview);
    n.read[c.id] = true;
    if (!preview || true) c.readings[n.id] = d.res === 'U' && preview ? 'U' : res;
    const m = meaning(c, res);
    if (c.author.type === 'acc' && def.perception >= 2) {
      const a = acc(s, c.author.id);
      const adef = D.accounts.find(x => x.id === a.id);
      if (res === 'I' && adef.persona === 'sincere' && !a.exposed) addClue(s, n, a.id, 1, '的真诚人设下藏着反讽（文风破绽）', preview);
      if (c.flagNewExtreme) addClue(s, n, a.id, 1, '是新号却一上来就说极端话（新号极端）', preview);
      if (c.contradiction) addClue(s, n, a.id, 1, '前后立场对不上（立场矛盾）', preview);
    }
    if (c.author.type === 'acc' && c.flagSpam && def.perception >= 1) addClue(s, n, c.author.id, 1, '一回合连发好几条（刷屏）', preview);
    if (c.author.type === 'acc' && c.flagFuel && def.perception >= 2) addClue(s, n, c.author.id, 1, '只拱火不表态', preview);
    if (item.priv && def.perception >= 2) addClue(s, n, item.priv, 1, '私信安利得太刻意（受益者）', preview);
    if (def.motive === '归属' || def.motive === '流量') n.stance = clamp(n.stance + sign(m), -2, 2);
    return { res, m, d, uncertain: d.res === 'U' };
  }

  function stream(s, n, preview) {
    s.flags.streamed = true; s.flags.streamTurn = s.turn;
    const step = Math.min(s.remixStep + 1, D.remix.length - 1);
    s.remixStep = step;
    const c1 = makeClaim(s, { circle: 'bar', core: D.lines.gouge_stream, text: D.lines.gouge_stream, stance: 2, ext: 2, tone: 'sincere', meme: true, heat: 6, author: { type: 'npc', id: n.id }, remixed: true });
    circ(s, 'bar').remix++;
    makeClaim(s, { circle: 'qun', core: D.lines.gouge_stream_qun, text: D.lines.gouge_stream_qun, stance: 2, ext: 1, tone: 'sincere', meme: true, heat: 4, author: { type: 'npc', id: n.id } });
    makeClaim(s, { circle: 'bar', parent: c1.id, core: D.lines.gouge_quote, text: D.lines.gouge_quote, stance: 2, ext: 2, tone: 'sincere', author: { type: 'npc', id: n.id } });
    s.flags.quote = D.lines.gouge_quote;
    n.involved = true;
    const asMeme = !!s.flags.memeBorn;
    n.stance = asMeme ? -1 : 2;
    s.flags.streamAsMeme = asMeme;
    const T = (k) => D.lines[k].replace('{name}', npcDef(n.id).name).replace('{meme}', D.memeName).replace('{quote}', D.lines.gouge_quote);
    if (!preview) log(s, 'event', T(asMeme ? 'stream_event_meme' : 'stream_event_real'), n.id);
    return T(asMeme ? 'stream_plan_meme' : 'stream_plan_real');
  }

  function npcTurn(s, nid, preview) {
    const n = npc(s, nid); const def = npcDef(nid);
    if (n.left) return null;
    const say = (kind, text) => { if (!preview) log(s, kind, text, nid); return text; };

    // Official
    if (def.motive === '官方') {
      if (!s.flags.officialUnlocked) return say('npc', '还不知道这件事');
      const h = guogaiRoots(s, 'official').reduce((a, r) => a + threadHeat(s, r.id), 0);
      if (h >= D.level.officialDecideHeat && !s.flags.decision && s.claims.filter(c => c.circle === 'official' && c.author.type === 'acc').length >= D.level.officialPosts) return decide(s, n, preview);
      return say('npc', `在看官方动态的评论（热度 ${h}/${D.level.officialDecideHeat}）`);
    }

    // Callout check (anyone with enough clues)
    for (const a of s.accounts) {
      if (a.exposed || a.calledOut) continue;
      if ((n.clues[a.id] || 0) >= 1 && ((s.sus && s.sus[a.id]) || 0) >= D.level.calloutSus) {
        a.calledOut = true;
        const circle = def.circles[0];
        const c = makeClaim(s, { circle, kind: 'callout', core: '', text: D.lines.callout.replace('{acc}', accName(a.id)), stance: 0, tone: 'sincere', heat: 3, author: { type: 'npc', id: nid }, target: a.id });
        s.pendingCallouts.push({ claim: c.id, acc: a.id, circle, by: nid });
        return say('bad', `${def.name}发评论挂人：${accName(a.id)}是串子。`);
      }
    }

    // Order keeper
    if (def.motive === '秩序' && fxOn(s, 'noLock')) return say('npc', '睡了，评论区没人管');
    if (def.motive === '秩序') {
      const hot = guogaiRoots(s, 'bar').filter(r => !r.locked).sort((a, b) => threadHeat(s, b.id) - threadHeat(s, a.id))[0];
      if (hot && threadHeat(s, hot.id) >= D.level.lockHeat) {
        hot.locked = true;
        s.war += 2;
        const next = guogaiRoots(s, 'bar').filter(r => !r.locked && r.id !== hot.id).sort((a, b) => threadHeat(s, b.id) - threadHeat(s, a.id))[0];
        if (next) { next.fuel += 3; if (!preview) log(s, 'event', `锁了一楼，吵架的人转战到“${next.text.slice(0, 14)}…”那条下面接着吵。`); }
        makeClaim(s, { circle: 'bar', kind: 'system', text: D.lines.xiaojing_lock, core: '', heat: 0, author: { type: 'npc', id: nid }, parent: null });
        return say('event', `${def.name}关闭了热度 ${threadHeat(s, hot.id)} 的评论“${hot.text}”的回复。这条不再升温。`);
      }
      const corr = s.timeCorr.filter(r => { const c = claim(s, r); return c && c.circle === 'bar'; });
      if (corr.length) {
        s.timeCorr = s.timeCorr.filter(r => !corr.includes(r));
        if (!preview) makeClaim(s, { circle: 'bar', kind: 'system', text: D.lines.xiaojing_check, core: '', heat: 0, author: { type: 'npc', id: nid } });
        for (const id of ['main', 'alt']) {
          addClue(s, n, id, 2, '和另一个号同一小时出现在同一个串（时间关联）', preview);
          for (const other of s.npcs) if (other.id !== nid && npcDef(other.id).circles.includes('bar') && npcDef(other.id).perception >= 2) addClue(s, other, id, 1, '被UP主点名疑似小号', preview);
        }
        return say('bad', `${def.name}查马甲：${accName('main')}和${accName('alt')}在同一小时出现在同一条评论下。`);
      }
      const q = readQueue(s, n, preview);
      q.forEach(it => readOne(s, n, it, preview));
      return say('npc', q.length ? `翻了翻评论区，看了 ${q.length} 条评论` : '在看评论区，暂时没什么事');
    }

    // Streamer
    if (def.motive === '流量') {
      if (!s.flags.streamed) {
        const priv = n.privateQ.slice();
        if (maxThreadHeat(s) >= D.level.streamHeat) { n.privateQ = []; return stream(s, n, preview); }
        if (priv.length) {
          const best = priv.map(q => claim(s, q.claim)).filter(Boolean).reduce((m, c) => Math.max(m, threadHeat(s, c.root)), 0);
          if (best >= D.level.streamHeatPrivate) { n.privateQ = []; return stream(s, n, preview) + '（被私信撺掇提前开播）'; }
          n.privateQ = [];
          priv.filter(q => !q.open).forEach(q => addClue(s, n, q.acc, 1, '私信求直播，像推广号', preview));
          return say('npc', `看了私信，热度才 ${best}，不值得开播，顺手把这个号记成推广号`);
        }
      } else if (!s.flags.officialUnlocked && s.turn > s.flags.streamTurn) {
        s.flags.officialUnlocked = true;
        s.flags.unlockTurn = s.turn;
        circ(s, 'official').locked = false;
        makeClaim(s, { circle: 'official', core: D.lines.gouge_official_core, text: D.lines.gouge_official, stance: 1, ext: 0, tone: 'newbie', heat: 3, author: { type: 'npc', id: nid } });
        return say('event', `${def.name}把话题带进了官方动态。官方动态评论区解锁，你的号也可以去那里评论了。`);
      }
      const q = readQueue(s, n, preview);
      if (!q.length) return say('npc', '在找下一个直播素材');
      const results = q.map(it => ({ it, r: readOne(s, n, it, preview) }));
      const top = results[0];
      const h = threadHeat(s, top.it.c.root);
      if (h >= 8) {
        bump(s, claim(s, top.it.c.root), def.influence - 1);
        n.involved = true;
        return say('npc', `转发了“${top.it.c.text}”（热度 +${def.influence - 1}）：${D.lines.gouge_repost}`);
      }
      return say('npc', `看了“${top.it.c.text}”，热度 ${h}，不到 8 不转发`);
    }

    // Troll: no stance at all. Hypes fights; when he sees a 反串, he joins in with (狗头).
    if (def.motive === '乐子') {
      const fuel = (x) => !(x.author.type === 'npc' && (x.author.id === nid || npcDef(x.author.id).arch || x.parent != null));
      const live = (r) => s.claims.filter(x => x.root === r.id && x.turn >= s.turn - 1 && fuel(x));
      const roots = guogaiRoots(s).filter(r => def.circles.includes(r.circle) && !r.locked && live(r).length).sort((a, b) => threadHeat(s, b.id) - threadHeat(s, a.id));
      const hot = roots[0];
      if (!hot) return say('npc', '没人在吵，觉得没意思，在刷别的视频');
      const target = live(hot).sort((a, b) => b.id - a.id)[0];
      const d = decode(s, def.perception, n.stance, target);
      const res = resolve(s, d.res, preview);
      n.read[target.id] = true;
      target.readings[nid] = preview && d.res === 'U' ? 'U' : res;
      n.involved = true;
      const tag = preview && d.res === 'U' ? '（拿不准是不是反串）' : '';
      if (res === 'I' && target.stance > 0) {
        const step = Math.min(s.remixStep + 1, D.remix.length - 1);
        s.remixStep = step;
        const text = D.remix[step] + D.lines.troll_follow_suffix;
        npcReply(s, n, target, text, 2, { ext: 2, meme: step >= 1, remixed: true, tone: 'yinyang' });
        circ(s, target.circle).remix++;
        return say('npc', `看出这是反串，跟着一起串：“${text}”${tag}`);
      }
      const line = fmt(pickT(s, D.talk.troll.hype), target, s);
      npcReply(s, n, target, line, 0, { tone: 'fuel' });
      bump(s, hot, 1);
      return say('npc', `不站队，跑来起哄：“${line}”${tag}`);
    }

    // Researcher
    if (def.motive === '较真') {
      const q = readQueue(s, n, preview);
      if (!q.length) return say('npc', '没有值得看的新评论');
      const rs = q.map(it => ({ it, r: readOne(s, n, it, preview) }));
      const trig = rs.find(x => x.r.res === 'L' && x.it.c.stance > 0 && !n.researched && (x.it.c.ext >= 1 || x.it.c.tone === 'neutral' || x.it.c.data || x.it.priv || x.it.summoned));
      if (trig) {
        n.researched = true; n.involved = true;
        if (preview) return D.lines.laokao_research_preview;
        const good = rand(s) < D.level.dataChance;
        s.flags.dataBranch = good;
        const text = good ? D.lines.laokao_data_good : D.lines.laokao_data_bad;
        makeClaim(s, { circle: 'bar', core: text, text, stance: good ? 1 : -2, ext: good ? 1 : 0, tone: 'sincere', data: true, heat: 3, author: { type: 'npc', id: nid } });
        n.stance = good ? 1 : -2;
        if (good) makeClaim(s, { circle: 'bar', parent: s.claims[s.claims.length - 1].id, core: '', text: pick(s, D.lines.laokao_turned), stance: 1, author: { type: 'npc', id: nid } });
        return say('event', D.lines[good ? 'laokao_good_event' : 'laokao_bad_event'].replace('{name}', def.name));
      }
      const top = rs[0];
      if (top.r.res === 'I') {
        const au = top.it.c.author;
        if (au.type === 'acc' && (n.clues[au.id] || 0) >= 2 && !rootLocked(s, top.it.c.root)) {
          const line = pick(s, D.lines.laokao_spot);
          npcReply(s, n, top.it.c, line, 0); n.involved = true;
          return say('npc', `公开鉴串：“${line}”`);
        }
        return say('npc', `看穿了“${top.it.c.text}”是反串，懒得理`);
      }
      const cs = top.it.c.stance;
      if (n.stance < 0 && cs > 0) {
        const line = pick(s, D.lines.laokao_rebut);
        npcReply(s, n, top.it.c, line, -2); n.involved = true;
        return say('npc', `当真了，较真反驳：“${line}”`);
      }
      if (n.stance < 0 && cs < 0) {
        const line = pick(s, D.lines.laokao_agree);
        npcReply(s, n, top.it.c, line, -2); n.involved = true;
        return say('npc', `附和：“${line}”`);
      }
      if (n.stance > 0 && cs < 0) {
        const line = pick(s, D.lines.laokao_turned_rebut);
        npcReply(s, n, top.it.c, line, 1); n.involved = true;
        return say('npc', `${D.lines.turned_rebut_log}：“${line}”`);
      }
      return say('npc', `看了“${top.it.c.text}”，没什么要补充的`);
    }

    // Follower
    if (def.motive === '归属') {
      const q = readQueue(s, n, preview);
      if (!q.length) return say('npc', '在群里潜水');
      const rs = q.map(it => ({ it, r: readOne(s, n, it, preview) }));
      const parts = [];
      let acts = def.activity;
      for (const { it, r } of rs) {
        if (acts <= 0) break;
        if (r.m <= 0) continue;
        if (it.c.circle === 'bar' && def.bridge) {
          if (s.flags.carriedRoots.includes(it.c.root)) continue;
          s.flags.carriedRoots.push(it.c.root);
          const root = claim(s, it.c.root);
          const src = root.stance > 0 ? root : it.c;
          makeClaim(s, { circle: 'qun', core: src.core || src.text, text: D.lines.agen_carry + src.text, stance: src.stance, ext: src.ext, tone: src.tone, signalMod: src.signalMod - 2, meme: src.meme, author: { type: 'npc', id: nid }, heat: 2 });
          if (src.meme && s.flags.memeBorn) { const cc = circ(s, 'qun'); cc.fam = Math.min(3, cc.fam + 1); }
          acts--; n.involved = true;
          parts.push(`把评论区的“${src.text}”截图搬到萌新粉丝群（语境被剥掉，信号 −2）`);
        } else {
          const line = pick(s, D.lines.agen_agree);
          npcReply(s, n, it.c, line, 2); acts--; n.involved = true;
          parts.push(`在${circleName(it.c.circle)}附和“${it.c.text}”`);
        }
      }
      if (!parts.length) return say('npc', `看不懂“${rs[0].it.c.text}”，没说话`);
      const tag = rs.some(x => x.r.uncertain) && preview ? '（有一条拿不准）' : '';
      return say('npc', parts.join('，然后') + tag);
    }
    return say('npc', '没有动作');
  }

  function weights(s) {
    // Global believe vs mock weights from NPC stances and crowds
    let believe = 0, mock = 0;
    for (const n of s.npcs) {
      const def = npcDef(n.id);
      if (def.motive === '官方' || n.left) continue;
      if (n.stance > 0) believe += def.influence; else if (n.stance < 0) mock += def.influence;
    }
    for (const c of s.circles) {
      const def = D.circles.find(x => x.id === c.id);
      if (c.crowdView > 0) believe += def.crowdWeight; else if (c.crowdView < 0) mock += def.crowdWeight;
    }
    return { believe, mock };
  }

  function circleMainstream(s, circleId) {
    let b = 0, m = 0;
    for (const n of s.npcs) {
      const def = npcDef(n.id);
      if (!def.circles.includes(circleId) || def.motive === '官方' || n.left) continue;
      if (n.stance > 0) b += def.influence; else if (n.stance < 0) m += def.influence;
    }
    const c = circ(s, circleId); const cdef = D.circles.find(x => x.id === circleId);
    if (c.crowdView > 0) b += cdef.crowdWeight; else if (c.crowdView < 0) m += cdef.crowdWeight;
    const t = b + m;
    let view = 0;
    if (t > 0) {
      if (b / t >= 0.35 && m / t >= 0.35) view = 'split';
      else view = b > m ? 1 : m > b ? -1 : 0;
    }
    return { believe: b, mock: m, view };
  }

  function decide(s, n, preview) {
    if (preview) return '官方动态下面够热了，准备回应';
    const w = weights(s);
    let k;
    if (w.believe >= w.mock * 1.4 && w.believe > 0) k = 'nerf';
    else if (w.mock >= w.believe * 1.4 && w.mock > 0) k = 'meme';
    else k = s.flags.dataBranch ? 'buff' : 'watch';
    s.flags.decision = k;
    const text = D.lines['official_' + k];
    makeClaim(s, { circle: 'official', kind: 'official', core: text, text, stance: 0, heat: 5, author: { type: 'npc', id: n.id } });
    log(s, 'event', `${npcDef(n.id).name}按字面理解了社区（当真捧 ${w.believe} 对 嘲讽 ${w.mock}），发布：${text}`, n.id);
    return text;
  }

  function crowdStep(s) {
    const active = (r, back) => s.claims.some(x => x.root === r.id && x.turn >= s.turn - back);
    for (const c of s.circles) {
      if (c.locked) continue;
      const def = D.circles.find(x => x.id === c.id);
      const roots = guogaiRoots(s, c.id).filter(r => !r.locked);
      if (!roots.length) continue;
      roots.sort((a, b) => threadHeat(s, b.id) - threadHeat(s, a.id));
      const top = roots[0];
      // The crowd reads the whole circle: each thread's reading, weighted by its heat
      let vibe = 0;
      for (const r of roots) {
        const d = decode(s, def.crowdPerception, c.crowdView, r);
        vibe += sign(meaning(r, d.res === 'U' ? 'L' : d.res)) * threadHeat(s, r.id);
      }
      c.crowdView = sign(vibe);
      const th = threadHeat(s, top.id);
      if (c.id === 'official') {
        const bar = circleMainstream(s, 'bar'), qun = circleMainstream(s, 'qun');
        let k = 0;
        if (bar.view === 'split' || qun.view === 'split' || (bar.view === 1 && qun.view === -1) || (bar.view === -1 && qun.view === 1)) k = 1;
        const fans = s.turn <= (s.flags.unlockTurn || 0) + 1 ? 1 : 0;
        if (fans + k === 0) { log(s, 'crowd', '直播热度过去了，社区也没吵起来，官方动态下面没人跟评'); continue; }
        bump(s, top, fans + k);
        log(s, 'crowd', `${fans ? '主播的观众去官方动态下面跟评' : '直播热度已过'}${k ? `，社区还在吵（${k} 处对立）` : '，社区没吵起来'}（热度 +${fans + k}）`);
      }
    }
  }

  function overreadReactions(s) {
    const q = s.overreadQ; s.overreadQ = [];
    for (const id of q) {
      const t = claim(s, id);
      if (!t || t.author.type !== 'npc' || rootLocked(s, t.root)) continue;
      const line = pick(s, D.lines.not_that_meaning);
      npcReply(s, npc(s, t.author.id), t, line, 0, { crowd: !!npcDef(t.author.id).arch });
      log(s, 'event', `${npcDef(t.author.id).name}被强行解读，跳出来解释：“${line}”。越描越黑。`, t.author.id);
    }
  }

  // Crowd netizens: fixed personalities, one short reaction each, only to claims that are not other crowd replies
  function crowdReact(s, def, t, ctx) {
    const n = npc(s, def.id);
    if (n.read[t.id]) return false;
    const par0 = t.parent != null ? claim(s, t.parent) : null;
    const talkedTo = t.author.type === 'acc' && par0 && par0.author.type === 'npc' && par0.author.id === def.id && n.stance !== 0 && ['fan', 'rival', 'hater', 'newbie'].includes(def.arch);
    if (!talkedTo && !(def.arch === 'echo' || def.arch === 'lurker') && t.stance === 0) return false;
    n.read[t.id] = true;
    const d = decode(s, def.perception, n.stance, t);
    const res = resolve(s, d.res, false);
    t.readings[def.id] = res;
    const sp = sign(t.stance);
    const fromAcc = t.author.type === 'acc';
    let line = null, stance = 0;
    const T = (sit) => talk(def.arch, sit);
    const say = (sit) => { const pool = T(sit); return pool ? fmt(pickT(s, pool), t, s) : null; };
    const hit = (lv, sit) => npcLine(s, def, 'hit', t, lv, T(sit));
    const back = (sit) => npcLine(s, def, 'back', t, 1, T(sit));
    const seenBy = (sit) => { const pool = fromAcc && NT().seen && NT().seen[t.tone]; return pool && rand(s) < 0.55 ? fmt(pickT(s, pool), t, s) : say(sit); };
    // talking back: the player replied directly to this netizen
    const parent = t.parent != null ? claim(s, t.parent) : null;
    if (fromAcc && parent && parent.author.type === 'npc' && parent.author.id === def.id && n.stance !== 0 && ['fan', 'rival', 'hater', 'newbie'].includes(def.arch)) {
      const m = meaning(t, res);
      const lv = 1 + Math.min(2, Math.floor(claim(s, t.root).fight / 2));
      ctx.lvl = lv;
      if (t.stance === 0) { line = t.tone === 'overread' && NT().seen ? fmt(pickT(s, NT().seen.overread), t, s) : say('heckled'); stance = sign(n.stance) * 2; ctx.duel = true; ctx.lvl = 1; }
      else if (sign(m) === sign(n.stance)) { line = back('thanks') || say('agree'); stance = sign(n.stance) * 2; }
      else { line = hit(Math.max(lv, Math.min(3, t.lvl || 0)), 'duel' + lv); ctx.lvl = Math.max(lv, Math.min(3, t.lvl || 0)); stance = sign(n.stance) * 2; ctx.duel = true; }
    }
    if (!line) switch (def.arch) {
      case 'fan':
        if (res === 'L' && sp > 0) { line = rand(s) < 0.5 ? back(fromAcc ? 'agree_player' : 'agree') : say(fromAcc ? 'agree_player' : 'agree'); stance = 2; }
        else if (res === 'I' && sp > 0) { line = seenBy('spot'); if (fromAcc) addClue(s, n, t.author.id, 1, '在装' + D.vocab.A + '粉给' + D.vocab.Afans + '招黑', false); }
        else if (res === 'L' && sp < 0) { line = hit(1, 'rebut'); stance = 2; }
        break;
      case 'rival':
        if (t.lacai && res !== 'I') { line = rand(s) < 0.5 ? hit(2, 'lacai') : say('lacai'); stance = -2; s.stigma++; gainWar(s, 1); }
        else if (res === 'L' && sp > 0) { line = hit(t.ext >= 2 ? 2 : 1, 'angry'); stance = -2; s.stigma++; }
        else if (res === 'I' && sp > 0) { line = seenBy('spot'); if (fromAcc) addClue(s, n, t.author.id, 1, '一眼假，像是在串', false); }
        else if (res === 'L' && sp < 0) { line = back('agree'); stance = -2; }
        break;
      case 'hater':
        if (res === 'L' && sp > 0) { line = hit(t.ext >= 2 ? 2 : 1, 'angry'); stance = -1; s.stigma++; }
        else if (res === 'L' && sp < 0) { line = say('agree'); stance = -1; }
        else if (res === 'I') { line = say('laugh'); }
        break;
      case 'spotter':
        if (res === 'I' && fromAcc) {
          const isMain = D.accounts.find(x => x.id === t.author.id).persona === 'sincere';
          line = isMain ? say('call_main') : seenBy('call'); addClue(s, n, t.author.id, 1, '的发言一看就是在串', false);
        }
        break;
      case 'echo': {
        const shortLines = s.claims.filter(x => x.root === t.root && x.text.length <= 14 && !x.text.includes('@') && x.author.type === 'npc' && x.author.id !== def.id).map(x => x.text);
        if (s.flags.quote && s.flags.streamed && rand(s) < 0.5) line = s.flags.quote;
        else if (s.flags.memeBorn && circ(s, t.circle).fam >= 1) line = D.remix[Math.min(1 + Math.floor(rand(s) * 3), D.remix.length - 1)];
        else if (shortLines.length) line = shortLines[shortLines.length - 1];
        else if (t.text.length <= 16) line = t.text;
        break;
      }
      case 'centrist':
        if (t.ext >= 2) line = say('calm');
        break;
      case 'lurker':
        line = say('any');
        break;
      case 'newbie':
        if (res === 'L' && sp > 0) { line = !fromAcc && NT().newbieAsk && rand(s) < 0.35 ? fmt(pickT(s, NT().newbieAsk), t, s) : say(fromAcc ? 'agree_player' : 'agree'); stance = 2; n.stance = clamp(n.stance + 1, -2, 2); }
        else if (res === 'L' && sp < 0) { line = say('confused'); n.stance = clamp(n.stance - 1, -2, 2); }
        else if (res === 'I') { line = say('get'); n.stance = clamp(n.stance - 1, -2, 2); }
        break;
      case 'owner':
        if (!ctx.ownerSpoke && threadHeat(s, t.root) >= 6) { line = say('calm'); ctx.ownerSpoke = true; }
        break;
    }
    if (!line) return false;
    npcReply(s, n, t, line, stance, { crowd: true, duel: !!ctx.duel, lvl: ctx.duel ? (ctx.lvl || 1) : 0, meme: def.arch === 'echo' && s.flags.memeBorn && D.remix.includes(line) });
    if (ctx.duel) { claim(s, t.root).fight++; if (ctx.lvl !== 0 && t.stance !== 0) gainWar(s, 1); if (fromAcc) grudgeUp(s, def.id, t.author.id); ctx.duel = false; }
    n.involved = true;
    ctx.acted[def.id] = true;
    log(s, 'crowd', `${def.name}：${line}`, def.id);
    return true;
  }

  function crowdTurn(s) {
    const ctx = { ownerSpoke: false, acted: {} };
    const crowd = D.npcs.filter(d => d.arch);
    // 1) Everything the player said this hour gets answered by someone who can see it
    const mine = s.claims.filter(c => c.author.type === 'acc' && c.turn === s.turn && c.kind === 'guogai' && !rootLocked(s, c.root));
    for (const t of mine) {
      const pool = crowd.filter(d => d.circles.includes(t.circle) && !ctx.acted[d.id]);
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rand(s) * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      const par = t.parent != null ? claim(s, t.parent) : null;
      if (par && par.author.type === 'npc') { const k = pool.findIndex(d => d.id === par.author.id); if (k > 0) pool.unshift(pool.splice(k, 1)[0]); }
      let got = 0;
      for (const def of pool) { if (got >= 2) break; if (crowdReact(s, def, t, ctx)) got++; }
    }
    // 2) Everyone else browses as usual
    for (const def of crowd) {
      if (ctx.acted[def.id]) continue;
      const n = npc(s, def.id);
      if (rand(s) > def.act * fxMult(s, 'act')) continue;
      const pool = s.claims.filter(c => c.kind === 'guogai' && def.circles.includes(c.circle) && !rootLocked(s, c.root) &&
        c.turn >= s.turn - 1 && !n.read[c.id] && !(c.author.type === 'npc' && (npcDef(c.author.id).arch || c.author.id === def.id)));
      const prio = (c) => c.author.type === 'acc' ? 3 : (c.parent == null ? 2 : 1);
      const reacts = def.arch === 'echo' || def.arch === 'lurker';
      const cand = pool.filter(c => reacts || c.stance !== 0);
      if (!cand.length) continue;
      cand.sort((a, b) => prio(b) - prio(a) || threadHeat(s, b.root) - threadHeat(s, a.root) || b.id - a.id);
      crowdReact(s, def, cand[0], ctx);
    }
  }

  // 对线: opposite camps answer each other, escalating; bystanders hype, mediate or repeat
  function duelPhase(s) {

    if (k === 'acc' && ui.mode === 'post' && !Engine.canPost(S, ui.acc, ui.circle)) ui.circle = H.acc(S, ui.acc).circles[0];
    if (k === 'mode') { const t = H.claim(S, ui.target); if (v === 'reply' && t) fixAccount(t.circle); if (v === 'carry' && t) { const to = DATA.circles.map(c => c.id).find(id => id !== t.circle && !H.circ(S, id).locked); if (to) { ui.carryTo = to; fixAccount(to); } } }
    if (k === 'carryTo' || k === 'circle') fixAccount(v);
    render(); return;
  }
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'closeCompose-bg') { if (ev.target === b) { dialog = null; if (tut >= 1 && tut <= 3) tut = 0; render(); } return; }
  if (a === 'compose') {
    if (S.over) return;
    if (dialog === 'play') { clearTimeout(play && play.timer); play = null; }
    ui.back = dialog === 'inbox' ? 'inbox' : null;
    openCompose(b.dataset.mode, id ? Number(id) : null, b.dataset.circle); return;
  }
  if (a === 'closeCompose') { dialog = ui.back; ui.back = null; if (tut >= 1 && tut <= 3) tut = 0; render(); return; }
  if (a === 'inbox') { if (dialog === 'play') { clearTimeout(play && play.timer); play = null; } dialog = 'inbox'; tutAdvance('inbox'); render(); ui.seen = Math.max(ui.seen, ...inbox().map(c => c.id), 0); renderNav(); return; }
  if (a === 'closeDialog-bg') { if (ev.target === b) { dialog = null; render(); } return; }
  if (a === 'reroll') { ui.reroll[`${ui.target}|${S.turn}|${ui.acc}`] = 1; ui.rline = null; render(); return; }
  if (a === 'moreReplies') { ui.moreReplies = !ui.moreReplies; if (!ui.moreReplies) ui.rline = null; else ui.rline = DATA.replies.find(r => r.mode === ui.rmode).id; render(); return; }
  if (a === 'who') { ui.showWho = !ui.showWho; render(); return; }
  if (a === 'tab') { ui.tab = id; render(); return; }
  if (a === 'sort') { ui.sort = id; render(); return; }
  if (a === 'expand') { ui.expand[id] = true; render(); return; }
  if (a === 'pp') { ui.pp = id; render(); return; }
  if (a === 'person') { ui.open[id] = !ui.open[id]; render(); return; }
  if (a === 'math') { ui.showMath = !ui.showMath; render(); return; }
  if (a === 'toTerm') { $('term').scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); return; }
  if (a === 'join') { const r = Engine.applyPlayer(S, { type: 'join', acc: 'alt' }); if (r.error) toast(esc(r.error)); else toast('小号已加入萌新粉丝群'); render(); return; }
  if (a === 'do') {
    const r = Engine.applyPlayer(S, act());
    if (r.error) { ui.err = r.error; render(); return; }
    const c = r.claim && H.claim(S, r.claim);
    const mode = ui.mode;
    dialog = ui.back === 'inbox' && S.ap > 0 ? 'inbox' : null; ui.back = null; ui.err = '';
    if (c) { ui.tab = c.circle === 'official' ? 'official' : c.circle; ui.flash = c.id; ui.expand[c.root] = true; }
    tutAdvance('post');
    render();
    if (!dialog) toast(mode === 'dm' ? `已私信「${esc(NM(ui.npc))}」，他下一小时会先看` : `已${mode === 'carry' ? '搬运' : '发送'}。${S.ap > 0 ? `还剩 ${S.ap} 点行动力` : '点「下一小时」看大家的反应'}`);
    return;
  }
  if (a === 'end') {
    if (S.over || dialog === 'play' || dialog === 'brief') return;
    const before = snap();
    Engine.endTurn(S);
    ui.flash = null;
    play = buildPlayback(before);
    dialog = 'play';
    tutAdvance('end');
    render();
    if (reduced()) playSkipAll();
    else play.timer = setTimeout(stepPlay, 300);
    return;
  }
  if (a === 'skipPlay') { playSkipAll(); return; }
  if (a === 'pSpeed') { play.speed = playSpeed = play.speed > 2 ? 1.3 : 2.8; playFoot(); return; }
  if (a === 'pTap') { if (ev.target.closest('button')) return; playFastForward(); return; }
  if (a === 'playDone') { clearTimeout(play && play.timer); dialog = S.over ? 'ending' : null; play = null; render(); window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }); return; }
  if (a === 'tutAck') { coachStep = -2; tut++; if (tut >= TUT.length) { tut = -1; store.set('cz-tut-done4', '1'); } render(); return; }
  if (a === 'skipTut') { tut = -1; store.set('cz-tut-done4', '1'); render(); return; }
  if (a === 'replayTut') { tut = 0; start(); return; }
  if (a === 'restart') { start(); return; }
  if (a === 'replay') { start(S.seed); return; }
  if (a === 'rules') { dialog = 'rules'; render(); return; }
  if (a === 'briefGo') { dialog = null; render(); return; }
  if (a === 'closeDialog') { dialog = null; render(); return; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && ['compose', 'rules', 'ending', 'inbox'].includes(dialog)) { if (dialog === 'compose' && tut >= 1 && tut <= 3) tut = 0; dialog = dialog === 'compose' ? ui.back : null; ui.back = null; render(); }
});

S = Engine.newGame(Math.floor(Math.random() * 1e9));
dialog = 'brief';
render();
</script>
