    hideT = setTimeout(() => box.classList.remove('on'), ms || Math.max(2600, n * 140 + 1400));
  }
  const TIPS = ['两个号说话的口气要不一样哦～', '对面信了你的话，才算点着火！', '一个号刷屏会被盯上的，换着来～', '嫌疑高了就潜水一小时，会慢慢降～', '被人@了？看「消息」里的牌，挑一张回！', '同一个招式用太多次会被看穿哦'];
  $id('m-body').addEventListener('click', () => say(TIPS[Math.floor(Math.random() * TIPS.length)], 'wink'));

  // ---------- particles ----------
  function burst(x, y, n = 14, kind) {
    if (RM()) return;
    const shapes = ['♥', '★', '✦', '♪'];
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i'); p.className = 'fx-p';
      p.textContent = kind || shapes[i % shapes.length];
      const a = R(0, Math.PI * 2), d = R(50, 130);
      p.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 30}px;--r:${R(-180, 180)}deg;--s:${R(.7, 1.4)};color:${['var(--fx-a)', 'var(--fx-b)', 'var(--fx-c)'][i % 3]}`;
      fx.appendChild(p); setTimeout(() => p.remove(), 950);
    }
  }
  function confetti(n = 90) {
    if (RM()) return;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i'); p.className = 'fx-cf';
      p.style.cssText = `left:${R(0, 100)}vw;--d:${R(1.8, 3.4)}s;--dl:${R(0, .6)}s;--x:${R(-80, 80)}px;--r:${R(360, 1080)}deg;background:${['var(--fx-a)', 'var(--fx-b)', 'var(--fx-c)', '#ffd84d', '#7fe0b0'][i % 5]}`;
      fx.appendChild(p); setTimeout(() => p.remove(), 4200);
    }
  }
  // ---------- cut-ins ----------
  function cutin(big, small, cls = '', ms = 950) {
    if (RM()) return;
    const c = document.createElement('div'); c.className = 'fx-cut ' + cls;
    c.innerHTML = `<div class="fx-lines"></div><div class="fx-band"></div><b>${big}</b>${small ? `<small>${small}</small>` : ''}`;
    fx.appendChild(c); setTimeout(() => c.remove(), ms);
  }
  function eyecatch(from, to) {
    if (RM()) return;
    const c = document.createElement('div'); c.className = 'fx-eye';
    c.innerHTML = `<div class="fx-wipe"></div><div class="fx-eye-in"><span>${from}</span><b>${to}</b><small>～ 一小时后 ～</small></div><div class="fx-eye-m">${chibi('wink')}</div>`;
    fx.appendChild(c); setTimeout(() => c.remove(), 1250);
  }
  function sticker(el, text) {
    if (RM() || !el) return;
    const s = document.createElement('i'); s.className = 'fx-don'; s.textContent = text; el.appendChild(s);
  }

  // ---------- ambient ----------
  function ambient() {
    document.querySelectorAll('.fx-amb').forEach(x => x.remove());
    const kind = css('--fx-amb') || 'none';
    if (kind === 'none' || RM()) return;
    const box = document.createElement('div'); box.className = 'fx-amb ' + kind; document.body.prepend(box);
    for (let i = 0; i < 16; i++) { const a = document.createElement('i'); a.style.cssText = `left:${R(0, 100)}%;--d:${R(9, 18)}s;--dl:${R(-18, 0)}s;--s:${R(.5, 1.1)};--x:${R(-60, 60)}px`; box.appendChild(a); }
  }
  ambient();

  // ---------- hooks ----------
  let pre = null;
  document.addEventListener('click', () => { if (!S.over) mas.style.zIndex = ''; pre = { claims: S.claims.length, dialog, war: S.war, sus: Math.max(S.sus ? S.sus.main || 0 : 0, S.sus ? S.sus.alt || 0 : 0), over: S.over }; }, true);
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b || !pre) return;
    const a = b.dataset.act;
    if (a === 'briefGo') setTimeout(() => say('两个号都准备好啦～<br>先挑一条评论下手吧！', 'happy', 4200), 350);
    if (a === 'do' && S.claims.length > pre.claims) {
      const r = b.getBoundingClientRect();
      burst(ev.clientX || r.left + r.width / 2, ev.clientY || r.top + r.height / 2, 16);
      const last = S.claims[S.claims.length - 1];
      if (last && last.combo === 'staged') { say('演双簧！<br>自己跟自己吵起来啦～', 'smug'); if (!RM()) cutin('左右互搏！', '演双簧', 'lv2', 900); }
      else if (last && last.combo === 'feed') say('递话成功～<br>一问一答，像真的一样', 'wink');
      else if (last && last.combo === 'vouch') say('帮另一个号说了句好话…<br>希望没人看出来（', 'shock');
      else pick([['发出去啦☆', 'happy'], ['嘿嘿，看谁先上钩～', 'smug'], ['坐等对线～', 'smug'], ['这句够阴阳吧（', 'wink']]);
      if (last && last.parent == null) setTimeout(() => { const el = document.querySelector('.cm.flash'); if (el) el.classList.add('fx-new'); }, 30);
    }
    if (a === 'end' && dialog === 'play' && play && !RM()) {
      clearTimeout(play.timer); play.timer = setTimeout(stepPlay, 1150);
      eyecatch(play.from, play.to);
    }
    if (a === 'playDone') {
      if (S.over) return ending();
      const dW = S.war - pre.war, sus = Math.max(S.sus.main || 0, S.sus.alt || 0);
      if (sus >= (DATA.level.calloutSus || 6) - 2) say('嫌疑有点高了…<br>先潜水一小时吧（发抖）', 'shock', 4200);
      else if (S.nemesis && !S._fxNem) { S._fxNem = 1; say('有人盯上我们了…<br>别老跟他吵！', 'shock', 4200); }
      else if (dW >= 6) say(`战火 +${dW}！吵得好～<br>再添把火！`, 'happy');
      else if (dW <= 1) say('还没吵起来…<br>换个更爆的话题试试？', 'normal');
    }
  });
  const pick = (arr) => { const x = arr[Math.floor(Math.random() * arr.length)]; return say(x[0], x[1]); };
  function ending() {
    mas.style.zIndex = 95;
    const key = S.ending && (S.ending.key || S.ending);
    const win = S.ending && S.ending.win != null ? S.ending.win : ['war', 'nerf', 'buff', 'meme', 'watch'].includes(key);
    setTimeout(() => {
      if (win) { cutin(key === 'war' ? '大战爆发！' : '官方下场！', '串子大成功', 'win', 1400); setTimeout(() => confetti(), 300); say('S级串子！<br>快夸我快夸我～', 'happy', 5000); }
      else if (key === 'exposed') { cutin('被扒了！！', 'バレた…', 'lose', 1400); say('呜呜…换个号再来吧', 'shock', 5000); }
      else { cutin('……没吵起来', '超时', 'flat', 1200); say('下次挑个更爆的话题！', 'normal', 5000); }
    }, 80);
  }
  // replay: tier cut-ins, ドン stickers, combo bursts
  const _pa = playAppend;
  playAppend = function (it, animate) {
    _pa(it, animate);
    if (!animate || !play || it.type !== 'bubble' || !it.c.duel) return;
    const lv = it.c.lvl || 1; play._lv = play._lv || 0;
    const el = document.querySelector('#p-feed .pi:last-child .bb');
    if (lv > play._lv && lv >= 2) cutin(lv === 2 ? '阴阳怪气！' : '上升了！！', lv === 2 ? '对线升级' : '人身攻击警告', 'lv' + lv, 850);
    play._lv = Math.max(play._lv, lv);
    if (lv >= 3) sticker(el, pick2(['ドン！', '啪！', 'バン！']));
    if (play.combo && play.combo % 5 === 0) { const h = $id('p-combo'); if (h) { const r = h.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 12, '✦'); } }
  };
  const pick2 = (a) => a[Math.floor(Math.random() * a.length)];
  // compose: deal the reply cards once per opening
  const ov = $id('overlay');
  new MutationObserver(() => {
    if (dialog !== 'compose') { delete ov.dataset.dealt; return; }
    if (!ov.dataset.dealt) setTimeout(() => { if (dialog === 'compose') ov.dataset.dealt = '1'; }, 700);
  }).observe(ov, { childList: true });
  window.CZFX = { say, burst, confetti, cutin, eyecatch, ambient };
})();
</script>
</body>
</html>
