<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>串子模拟器原型</title>
<style>
/* Layout: two layers, kept visually apart.
   Left = the simulated website (fictional video site "叽哩站": video, comments, fan group, official feed) in a light, familiar video-site style.
   Right = the game layer ("串子终端"): a dark console with clock, action points, next-hour button, progress, hints, people.
   Speaking happens in a modal opened from the site's own reply buttons; each hour resolves in a playback modal. */
:root {
  --bg: #f1f2f3;
  --card: #ffffff;
  --card-2: #f6f7f8;
  --line: #e3e5e7;
  --ink: #18191c;
  --ink-2: #61666d;
  --ink-3: #9499a0;
  --pink: #fb7299;
  --pink-soft: #ffecf1;
  --blue: #00aeec;
  --blue-soft: #e3f6fd;
  --literal: #22a06b;
  --irony: #e8613c;
  --unsure: #4e8fd6;
  --warn: #f04c49;
  --gold: #e9a23b;
  --player: #1d2a3a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  /* game layer */
  --t-bg: #1b1f2a;
  --t-bg-2: #252a37;
  --t-line: #343a4a;
  --t-ink: #e8ebf2;
  --t-ink-2: #a3abbd;
  --t-ink-3: #6f7890;
  --t-acc: #ff8fb1;
  --t-go: #5fd0a5;
  --font: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --card: #222326; --card-2: #2a2c2f; --line: #34363a; --ink: #e5e7ea; --ink-2: #a9aeb5; --ink-3: #777c83;
    --pink: #ff7fa4; --pink-soft: #3a2630; --blue: #2bb8f0; --blue-soft: #1d3340; --literal: #4cc38a; --irony: #f07a55; --unsure: #6fa6e6; --warn: #ff6b68; --gold: #f0b24f;
    --player: #0e141c; --shadow: 0 1px 2px rgba(0,0,0,0.3);
    --t-bg: #101319; --t-bg-2: #1a1e27; --t-line: #2a3040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181a; --card: #222326; --card-2: #2a2c2f; --line: #34363a; --ink: #e5e7ea; --ink-2: #a9aeb5; --ink-3: #777c83;
  --pink: #ff7fa4; --pink-soft: #3a2630; --blue: #2bb8f0; --blue-soft: #1d3340; --literal: #4cc38a; --irony: #f07a55; --unsure: #6fa6e6; --warn: #ff6b68; --gold: #f0b24f;
  --player: #0e141c; --shadow: 0 1px 2px rgba(0,0,0,0.3);
  --t-bg: #101319; --t-bg-2: #1a1e27; --t-line: #2a3040;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.6; padding-bottom: 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--card); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.ink2 { color: var(--ink-2); } .ink3 { color: var(--ink-3); }
svg.i { width: 18px; height: 18px; flex: none; }

/* ===== Site layer ===== */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); border-bottom: 1px solid var(--line); }
.nav-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.logo { display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--pink); font-size: 19px; white-space: nowrap; }
.logo i { width: 26px; height: 22px; border-radius: 6px; background: var(--pink); position: relative; display: block; }
.logo i::before, .logo i::after { content: ""; position: absolute; top: 8px; width: 4px; height: 6px; border-radius: 2px; background: #fff; }
.logo i::before { left: 7px; } .logo i::after { right: 7px; }
.search { flex: 1; max-width: 440px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; color: var(--ink-3); }
.search span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.me-chip { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.me-chip img { width: 30px; height: 30px; border-radius: 50%; image-rendering: pixelated; }

.page { max-width: 1320px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 360px; align-items: start;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.site { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }

.video { overflow: hidden; }
.player { position: relative; aspect-ratio: 16 / 7; max-height: 320px; width: 100%; background: radial-gradient(120% 140% at 80% 10%, #3b5b8a 0%, var(--player) 55%), var(--player); overflow: hidden; }
.player .art { position: absolute; inset: 0; display: grid; place-items: center; }
.player .art img { width: 104px; height: 104px; image-rendering: pixelated; opacity: 0.92; }
.player .cap { position: absolute; left: 18px; bottom: 16px; color: #fff; font-weight: 800; font-size: clamp(18px, 3vw, 28px); text-shadow: 0 2px 8px rgba(0,0,0,0.5); line-height: 1.2; }
.player .cap small { display: block; font-size: 13px; font-weight: 500; opacity: 0.8; }
.player .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.2); }
.player .bar i { display: block; height: 100%; background: var(--pink); }
.dm { position: absolute; inset: 10px 0 64px; pointer-events: none; overflow: hidden; }
.dm span { position: absolute; left: 100%; white-space: nowrap; color: #fff; font-size: 15px; font-weight: 600; text-shadow: 0 0 2px #000, 0 1px 3px rgba(0,0,0,0.8); animation: fly 12s linear infinite; }
.dm span.hot { color: #ffd36b; }
.dm span.mine { color: #8fe3ff; }
@keyframes fly { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 100%)); } }
.vinfo { padding: 14px 18px 4px; display: grid; gap: 6px; }
.vinfo h1 { margin: 0; font-size: 19px; line-height: 1.4; text-wrap: balance; }
.vmeta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-3); }
.vacts { display: flex; flex-wrap: wrap; gap: 4px 22px; padding: 8px 18px 16px; color: var(--ink-2); font-size: 14px; }
.vacts span { display: inline-flex; align-items: center; gap: 6px; }

.ctabs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; padding: 14px 18px 0; border-bottom: 1px solid var(--line); }
.ctabs button { background: none; border: none; padding: 4px 0 10px; font-size: 16px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ctabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--pink); }
.ctabs button small { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 4px; font-family: var(--num); }
.ctabs .badge { font-size: 11px; color: #fff; background: var(--pink); border-radius: 99px; padding: 0 6px; margin-left: 4px; font-weight: 600; }
.ctabs .sort { margin-left: auto; display: inline-flex; gap: 2px; padding-bottom: 8px; }
.ctabs .sort button { font-size: 13px; padding: 2px 8px; border-radius: 6px; border: none; margin: 0; }
.ctabs .sort button[aria-pressed="true"] { background: var(--card-2); color: var(--ink); font-weight: 600; }
.mood { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 0; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--card-2); color: var(--ink-2); }
.pill.warn { color: var(--warn); }
.pill.pink { background: var(--pink-soft); color: var(--pink); }
.box { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 18px; }
.box img { width: 40px; height: 40px; border-radius: 50%; image-rendering: pixelated; }
.fake-input { text-align: left; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink-3); font-size: 13.5px; width: 100%; }
.fake-input:hover { border-color: var(--blue); }
.sbtn { border: none; background: var(--blue); color: #fff; border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.sbtn.ghost { background: var(--card-2); color: var(--ink-2); }
.sbtn:disabled { opacity: 0.45; cursor: not-allowed; }

.comments { display: grid; padding: 0 18px 8px; }
.cm { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); }
.cm.locked { opacity: 0.7; }
.cm.flash > div > .ctext, .rep.flash .rtext { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { background: var(--pink-soft); } 100% { background: transparent; } }
.av { border-radius: 50%; image-rendering: pixelated; background: var(--card-2); display: block; }
.cm > .av { width: 44px; height: 44px; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; }
.uname { font-weight: 600; color: var(--ink-2); }
.uname.vip { color: var(--pink); }
.uname.me { color: var(--blue); }
.lv { font-family: var(--num); font-size: 9.5px; font-weight: 700; line-height: 1; padding: 2px 3px; border-radius: 3px; color: #fff; }
.tag { font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.tag.up { color: var(--pink); } .tag.vip { color: var(--gold); } .tag.off { color: var(--blue); } .tag.mod { color: var(--literal); } .tag.me { color: var(--blue); } .tag.op { color: var(--ink-3); }
.tag.warn { color: #fff; background: var(--warn); border-color: var(--warn); }
.tag.gold { color: #fff; background: var(--gold); border-color: var(--gold); }
.ctext { margin: 4px 0 6px; font-size: 15px; overflow-wrap: anywhere; border-radius: 6px; }
.ctext.shot::before, .bubble.shot::before { content: "[截图] "; color: var(--ink-3); font-size: 12px; }
.at { color: var(--blue); }
.cmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 12.5px; color: var(--ink-3); }
.cmeta button { background: none; border: none; padding: 0; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; }
.cmeta button:hover { color: var(--blue); }
.cmeta button.more-act { letter-spacing: 1px; font-weight: 700; }
.replies { margin-top: 10px; background: var(--card-2); border-radius: 8px; padding: 4px 12px; display: grid; }
.rep { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; padding: 7px 0; }
.rep > .av { width: 24px; height: 24px; }
.rtext { font-size: 14px; overflow-wrap: anywhere; border-radius: 4px; }
.rtext .who { display: inline-flex; margin-right: 4px; }
.more { background: none; border: none; color: var(--ink-3); font-size: 12.5px; padding: 4px 0; text-align: left; }
.more:hover { color: var(--blue); }
.locked-note { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.empty { text-align: center; color: var(--ink-3); padding: 30px 0; }
.lockpage { text-align: center; color: var(--ink-3); padding: 40px 18px; display: grid; gap: 6px; }

.chat { display: grid; gap: 10px; max-height: 520px; overflow-y: auto; padding: 14px 18px; background: var(--card-2); }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; }
.msg.me { grid-template-columns: minmax(0, 1fr) 32px; }
.msg.me > .av { order: 2; }
.msg > .av { width: 32px; height: 32px; }
.msg .n { font-size: 11.5px; color: var(--ink-3); }
.msg.me .n, .msg.me .bw { text-align: right; }
.bubble { display: inline-block; max-width: 100%; padding: 7px 11px; border-radius: 4px 12px 12px 12px; background: var(--card); font-size: 14px; overflow-wrap: anywhere; text-align: left; }
.msg.me .bubble { background: var(--blue); color: #fff; border-radius: 12px 4px 12px 12px; }
.msg .cmeta { margin-top: 2px; }
.msg.me .cmeta { justify-content: flex-end; }

/* ===== Game layer: 串子终端 ===== */
.term { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 84px); overflow-y: auto; scrollbar-width: thin;
  background: var(--t-bg); color: var(--t-ink); border-radius: 14px; box-shadow: 0 8px 30px rgba(10, 14, 25, 0.25); display: grid; align-content: start; }
.t-head { padding: 14px 16px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--t-line); }
.t-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; letter-spacing: 0.12em; color: var(--t-ink-3); }
.t-title b { color: var(--t-acc); letter-spacing: 0.08em; }
.t-title button { background: none; border: none; color: var(--t-ink-2); font-size: 12px; padding: 0; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; }
.t-clock { display: flex; align-items: center; gap: 12px; }
.t-clock .time { font-family: var(--num); font-size: 30px; font-weight: 600; line-height: 1; }
.t-clock .sub { font-size: 12px; color: var(--t-ink-2); line-height: 1.4; }
.t-ap { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
.t-ap i { width: 10px; height: 10px; border-radius: 50%; background: var(--t-line); display: block; }
.t-ap i.on { background: var(--t-acc); }
.t-next { width: 100%; border: none; border-radius: 10px; padding: 11px 14px; font-weight: 700; font-size: 15px; background: var(--t-go); color: #0d2a1f; display: flex; justify-content: space-between; align-items: center; }
.t-next:hover { filter: brightness(1.06); }
.t-next:disabled { opacity: 0.4; cursor: not-allowed; }
.t-next small { font-weight: 500; font-size: 12px; opacity: 0.75; }
.t-sec { padding: 12px 16px; border-bottom: 1px solid var(--t-line); display: grid; gap: 8px; }
.t-sec h4 { margin: 0; font-size: 11.5px; letter-spacing: 0.1em; color: var(--t-ink-3); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.t-sec h4 button { background: none; border: none; padding: 0; color: var(--t-ink-2); font-size: 12px; letter-spacing: 0; }
.ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.ladder div { font-size: 11px; text-align: center; padding: 6px 2px; border-radius: 6px; background: var(--t-bg-2); color: var(--t-ink-3); line-height: 1.3; }
.ladder div.on { background: color-mix(in srgb, var(--t-acc) 22%, transparent); color: var(--t-acc); font-weight: 600; }
.ladder small { display: block; font-size: 10px; opacity: 0.8; }
.t-steps { display: flex; gap: 3px; }
.t-steps i { flex: 1; height: 3px; border-radius: 2px; background: var(--t-line); display: block; }
.t-steps i.on { background: var(--t-acc); }
.t-text { margin: 0; font-size: 13.5px; line-height: 1.65; }
.t-text b { color: var(--t-acc); font-weight: 600; }
.t-btn { justify-self: start; border: 1px solid var(--t-line); background: var(--t-bg-2); color: var(--t-ink); border-radius: 8px; padding: 6px 14px; font-size: 13px; }
.t-btn.acc { background: var(--t-acc); border-color: var(--t-acc); color: #3a0a1a; font-weight: 700; }
.hints { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.hints li { font-size: 13px; padding-left: 12px; position: relative; color: var(--t-ink-2); line-height: 1.6; }
.hints li b { color: var(--t-ink); }
.hints li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--t-acc); }
.ptabs { display: flex; gap: 14px; }
.ptabs button { background: none; border: none; padding: 0 0 4px; color: var(--t-ink-3); border-bottom: 2px solid transparent; font-size: 12.5px; }
.ptabs button[aria-selected="true"] { color: var(--t-ink); border-bottom-color: var(--t-acc); }
.plist { display: grid; gap: 2px; margin: 0 -8px; }
.person { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 8px; border: none; background: none; text-align: left; border-radius: 10px; width: 100%; color: inherit; }
.person:hover { background: var(--t-bg-2); }
.person > .av { width: 32px; height: 32px; }
.person .n { font-weight: 600; font-size: 13px; }
.person .r { font-size: 11.5px; color: var(--t-ink-3); margin-left: 6px; }
.person .plan { font-size: 12.5px; color: var(--t-ink-2); overflow-wrap: anywhere; }
.sus { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: #ffb38a; }
.sus.hot { color: #ff7b7b; font-weight: 600; }
.dots { display: inline-flex; gap: 2px; margin-left: 4px; vertical-align: middle; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--t-line); display: block; }
.dots i.on { background: currentColor; }
.detail { font-size: 12px; color: var(--t-ink-2); display: grid; gap: 2px; padding-top: 4px; }
.group { font-size: 11.5px; color: var(--t-ink-3); padding: 6px 8px 0; }
.log { display: grid; gap: 10px; max-height: 340px; overflow-y: auto; font-size: 12.5px; }
.log h5 { margin: 0; font-family: var(--num); font-size: 11.5px; color: var(--t-ink-3); font-weight: 500; }
.log .l { color: var(--t-ink-2); padding-left: 8px; border-left: 2px solid var(--t-line); }
.log .l.event { color: var(--t-ink); border-left-color: var(--t-acc); }
.log .l.player { color: #8fd8ff; border-left-color: #8fd8ff; }
.log .l.bad { color: #ff8b8b; border-left-color: #ff8b8b; }

.mbar { display: none; }

/* ===== Modals (game layer) ===== */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(8, 10, 16, 0.55); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: 100%; max-width: 560px; max-height: 100%; overflow: hidden; background: var(--t-bg); color: var(--t-ink); border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.m-head, .m-foot { flex: none; }
.m-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--t-line); }
.m-head h2 { margin: 0; font-size: 16px; }
.m-head button { background: none; border: none; color: var(--t-ink-2); font-size: 20px; line-height: 1; padding: 2px 6px; }
.m-body { padding: 14px 18px; display: grid; gap: 14px; overflow-y: auto; flex: 1 1 auto; min-height: 0; align-content: start; }
.m-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--t-line); flex-wrap: wrap; }
.m-foot .tip { font-size: 12px; color: var(--t-ink-3); }
.quote { background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.quote img { width: 30px; height: 30px; border-radius: 50%; image-rendering: pixelated; }
.quote .q { font-size: 14px; overflow-wrap: anywhere; }
.quote .k { font-size: 11px; color: var(--ink-3); }
.lbl { font-size: 11.5px; color: var(--t-ink-3); letter-spacing: 0.04em; }
.row { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--t-line); background: var(--t-bg-2); border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--t-ink-2); }
.chip:hover { color: var(--t-ink); }
.chip[aria-pressed="true"] { background: var(--t-ink); color: var(--t-bg); border-color: var(--t-ink); font-weight: 600; }
.chip:disabled { opacity: 0.35; cursor: not-allowed; }
.chip img { width: 18px; height: 18px; border-radius: 50%; vertical-align: -4px; margin-right: 4px; image-rendering: pixelated; }
.mtabs { display: flex; gap: 18px; border-bottom: 1px solid var(--t-line); }
.mtabs button { background: none; border: none; padding: 0 0 8px; color: var(--t-ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 14px; }
.mtabs button[aria-selected="true"] { color: var(--t-ink); border-bottom-color: var(--t-acc); font-weight: 600; }
.mtabs button:disabled { opacity: 0.4; cursor: not-allowed; }
.desc { font-size: 12.5px; color: var(--t-ink-2); margin: 0; }
.cands { display: grid; gap: 6px; }
.cand { text-align: left; border: 1px solid var(--t-line); background: var(--t-bg-2); border-radius: 10px; padding: 9px 11px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 13.5px; color: var(--t-ink); }
.cand:hover { border-color: var(--t-ink-3); }
.cand[aria-pressed="true"] { border-color: var(--t-acc); background: color-mix(in srgb, var(--t-acc) 12%, var(--t-bg-2)); }
.cand small { font-size: 11px; color: var(--t-ink-3); white-space: nowrap; }
.preview { background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.preview img { width: 30px; height: 30px; border-radius: 50%; image-rendering: pixelated; }
.preview .k { font-size: 11px; color: var(--ink-3); }
.preview .q { font-size: 14px; overflow-wrap: anywhere; }
.pre { background: var(--t-bg-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; }
.pre .h { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--t-ink-3); }
.pre .h button { background: none; border: none; padding: 0; color: var(--t-ink-2); font-size: 12px; text-decoration: underline; }
.pre > span { overflow-wrap: anywhere; color: var(--t-ink-2); }
.pre .L { color: #6fdca6; font-weight: 600; } .pre .I { color: #ff9f7a; font-weight: 600; } .pre .U { color: #8fbaf0; font-weight: 600; } .pre .F { color: #ff7b7b; font-weight: 600; }
.math { font-family: var(--num); font-size: 11.5px; color: var(--t-ink-3); display: grid; }
.err { color: #ff8b8b; font-size: 13px; margin: 0; }
.go { border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; font-size: 14px; background: var(--t-acc); color: #3a0a1a; }
.go:disabled { opacity: 0.45; cursor: not-allowed; }
.go.green { background: var(--t-go); color: #0d2a1f; }
.ghost { border: 1px solid var(--t-line); border-radius: 10px; padding: 9px 16px; background: none; color: var(--t-ink-2); font-size: 13.5px; }

/* Playback */
.feed { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 9px 11px; border-radius: 10px; background: var(--t-bg-2); animation: pop 0.35s ease-out both; }
.ev img { width: 30px; height: 30px; border-radius: 50%; image-rendering: pixelated; }
.ev .k { font-size: 11.5px; color: var(--t-ink-3); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.ev .k b { color: var(--t-ink); font-weight: 600; font-size: 12.5px; }
.ev .q { font-size: 14px; overflow-wrap: anywhere; }
.ev .why { font-size: 12px; color: var(--t-ink-3); }
.ev.toyou { box-shadow: inset 3px 0 0 var(--t-acc); }
.ev .flag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: color-mix(in srgb, var(--t-acc) 20%, transparent); color: var(--t-acc); }
.ev .flag.L { background: color-mix(in srgb, #6fdca6 18%, transparent); color: #6fdca6; }
.ev .flag.I { background: color-mix(in srgb, #ff9f7a 18%, transparent); color: #ff9f7a; }
.big { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--t-acc) 16%, var(--t-bg-2)); font-size: 14px; animation: pop 0.35s ease-out both; }
.big.bad { background: color-mix(in srgb, #ff6b68 18%, var(--t-bg-2)); color: #ffc2c0; }
.big.clue { background: var(--t-bg-2); color: #ffc69a; font-size: 13px; }
.sum { display: grid; gap: 6px; padding: 12px; border-radius: 12px; border: 1px solid var(--t-line); animation: pop 0.35s ease-out both; }
.sum h3 { margin: 0; font-size: 13px; color: var(--t-ink-3); letter-spacing: 0.08em; }
.sum div { font-size: 13.5px; }
.sum .up { color: #6fdca6; } .sum .down { color: #ff9f7a; } .sum .warn { color: #ff8b8b; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.toast { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 70; background: var(--t-bg); color: var(--t-ink); padding: 8px 16px; border-radius: 99px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: pop 0.25s ease-out both; max-width: calc(100vw - 32px); }

.dialog-grade { font-size: 12px; letter-spacing: 0.12em; color: var(--t-acc); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { background: var(--t-bg-2); border-radius: 10px; padding: 8px 10px; display: grid; }
.stats span { font-size: 12px; color: var(--t-ink-3); }
.stats b { font-family: var(--num); font-size: 20px; }
.chain { display: grid; gap: 4px; font-size: 13px; background: var(--t-bg-2); border-radius: 10px; padding: 10px 12px; color: var(--t-ink-2); }
.chain b { color: var(--t-ink); }
.modal ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--t-ink-2); font-size: 13.5px; }

/* Guide highlight */
.guide-hl { box-shadow: 0 0 0 2px var(--t-acc), 0 0 0 6px color-mix(in srgb, var(--t-acc) 30%, transparent) !important; border-radius: 10px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px var(--t-acc), 0 0 0 10px transparent; } }

@media (prefers-reduced-motion: reduce) {
  .dm span { animation: none; position: static; display: inline-block; margin: 2px 8px; }
  .dm { display: flex; flex-wrap: wrap; align-content: flex-start; padding: 0 10px; }
  .guide-hl, .ev, .big, .sum, .toast, .cm.flash > div > .ctext, .rep.flash .rtext { animation: none; }
}
@media (max-width: 1060px) {
  .page { grid-template-columns: minmax(0, 1fr); }
  .term { position: static; max-height: none; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--t-bg); color: var(--t-ink); align-items: center; gap: 12px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .mbar .time { font-family: var(--num); font-size: 18px; font-weight: 600; }
  .mbar .sub { font-size: 12px; color: var(--t-ink-2); flex: 1; }
  .mbar .t-next { width: auto; padding: 9px 16px; }
  .mbar .jump { background: none; border: 1px solid var(--t-line); color: var(--t-ink-2); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; }
  .t-head .t-next { display: none; }
}
@media (max-width: 560px) {
  .search, .me-chip span { display: none; }
  .player { aspect-ratio: 16 / 9; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cm { grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
  .cm > .av { width: 36px; height: 36px; }
  .box { grid-template-columns: 32px minmax(0, 1fr); }
  .box img { width: 32px; height: 32px; }
  .box .sbtn { display: none; }
}

/* win / lose panel */
.wl { display: grid; gap: 5px; }
.wl-h { font-size: 11px; font-weight: 700; letter-spacing: .08em; margin-top: 2px; }
.wl-h.win { color: #6fdca6; } .wl-h.lose { color: #ff9f7a; margin-top: 6px; }
.wl-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12px; color: var(--t-ink-2); }
.wl-row b { font-size: 12px; color: var(--t-ink); font-variant-numeric: tabular-nums; text-align: right; }
.wl-row b.small { font-weight: 500; font-size: 11px; color: var(--t-ink-3); max-width: 150px; text-align: right; line-height: 1.3; }
.wl-row.danger span:first-child, .wl-row.danger b { color: #ff7a6b; }
.meter { display: block; height: 6px; border-radius: 99px; background: var(--t-bg-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--t-acc); transition: width .4s; }
.meter.fire i { background: linear-gradient(90deg, #ffb84d, #ff5a4d); }
.meter.gold i { background: #e9c46a; }
.meter.red i { background: #ff7a6b; }
.meter.time i { background: #7f8ff0; }
.ev .flag.fire, .big.fire, .sum .fire { color: #ff8a5c; }
.ev .flag.fire { background: color-mix(in srgb, #ff8a5c 18%, transparent); }
.dialog-grade.lose { color: #ff7a6b; }
.qt { color: var(--ink-2, #61666d); background: color-mix(in srgb, currentColor 8%, transparent); border-radius: 3px; padding: 0 2px; }

/* messages button (site layer) */
.msgbtn { margin-left: auto; position: relative; display: flex; align-items: center; gap: 5px; background: none; border: none; color: var(--ink-2); font-size: 13px; padding: 6px 8px; border-radius: 8px; }
.msgbtn:hover { background: var(--card-2); color: var(--ink); }
.msgbtn .i { width: 19px; height: 19px; }
.msgbtn b { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--pink); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }
.msgbtn + .me-chip { margin-left: 0; }
.rep.tome { box-shadow: inset 2px 0 0 var(--blue); padding-left: 8px; margin-left: -8px; }
.atme { font-size: 11px; color: #fff; background: var(--blue); border-radius: 4px; padding: 0 5px; margin-right: 6px; font-weight: 600; }
.atme.fire { background: #f06a4d; }
.fightpill { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: color-mix(in srgb, #f06a4d 14%, transparent); color: #e2553a; font-weight: 600; }
/* forecast */
.fc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.fc > div { background: var(--t-bg); border-radius: 8px; padding: 7px 9px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.fc small { font-size: 11px; color: var(--t-ink-3); width: 100%; }
.fc small + b + small { width: auto; }
.fc b { font-size: 17px; font-family: var(--num); font-weight: 700; color: var(--t-ink); }
.fc .good b { color: #ffa25c; } .fc .dim b { color: var(--t-ink-3); }
.fc .warn b { color: #ffcf6b; } .fc .bad b { color: #ff7a6b; }
.pre .whol { font-size: 12.5px; color: var(--t-ink-2); }
.pre .whol .fire, .pre .whol.dim { color: #ffa25c; }
.pre .whol.dim { color: var(--t-ink-3); }
.pre .fold { justify-self: start; background: none; border: none; padding: 0; color: var(--t-ink-3); font-size: 12px; text-decoration: underline; }
.pre .det { display: grid; gap: 4px; }
.pre .det > span { overflow-wrap: anywhere; color: var(--t-ink-2); }
.chip.risky { border-color: #ff7a6b; color: #ff9f94; }
.chip.risky[aria-pressed="true"] { background: #ff7a6b; border-color: #ff7a6b; color: #2a0b07; }
/* playback reply button */
.ev-reply { display: none; margin-top: 6px; justify-self: start; border: 1px solid var(--t-line); background: none; color: var(--t-acc); border-radius: 8px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; }
.feed.done .ev-reply { display: inline-block; }
.ev .flag.bad, .ib .flag.bad { background: color-mix(in srgb, #ff6b68 20%, transparent); color: #ff8b8b; }
/* inbox */
.m-body h5 { margin: 4px 0 -6px; font-size: 11.5px; color: var(--t-ink-3); font-weight: 600; letter-spacing: .06em; }
.ib { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; background: var(--t-bg-2); }
.ib.new { box-shadow: inset 3px 0 0 var(--t-acc); }
.ib img { width: 32px; height: 32px; border-radius: 50%; image-rendering: pixelated; }
.ib .k { font-size: 11.5px; color: var(--t-ink-3); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.ib .k b { color: var(--t-ink); font-size: 13px; }
.ib .q { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.ib .orig { font-size: 12px; color: var(--t-ink-3); margin-top: 4px; overflow-wrap: anywhere; }
.ib .flag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: color-mix(in srgb, var(--t-acc) 20%, transparent); color: var(--t-acc); }
.ib .flag.fire { background: color-mix(in srgb, #ff8a5c 18%, transparent); color: #ff8a5c; }
.ib .flag.I { background: color-mix(in srgb, #ff9f7a 18%, transparent); color: #ff9f7a; }
.ib .flag.L { background: color-mix(in srgb, #6fdca6 18%, transparent); color: #6fdca6; }
.ib-reply { border: none; background: var(--t-acc); color: #3a0a1a; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.ib-off { font-size: 12px; color: var(--t-ink-3); white-space: nowrap; }
.mbar .sub { display: grid; gap: 2px; white-space: nowrap; font-size: 11.5px; min-width: 0; }
.desc.warn { color: #ffcf6b; }
.mbar .sub b.fire { color: #ffa25c; }
.mbar .sub .hot { color: #ff7a6b; font-weight: 700; }
@media (max-width: 560px) {
  .msgbtn span { display: none; }
  .ib { grid-template-columns: 28px minmax(0, 1fr); }
  .ib img { width: 28px; height: 28px; }
  .ib-reply, .ib-off { grid-column: 2; justify-self: start; }
  .fc b { font-size: 15px; }
}

/* ===== game feel ===== */
.player .art.vs { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 4vw, 36px); background:
  linear-gradient(105deg, #2c5cc5 0%, #3d7ff0 46%, transparent 46.2%), linear-gradient(105deg, transparent 53.8%, #f08a3c 54%, #d9532e 100%), #141824; }
.art.vs span { font-size: clamp(26px, 7vw, 60px); font-weight: 900; color: #fff; letter-spacing: .06em; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
.art.vs b { font-size: clamp(22px, 5vw, 44px); font-weight: 900; font-style: italic; color: #ffe066; text-shadow: 0 0 18px rgba(255, 210, 80, .7), 0 3px 0 #7a3b00; }
.hud { display: grid; gap: 10px; padding: 12px 16px 4px; }
.war { position: relative; padding: 10px 12px 12px; border-radius: 12px; background: linear-gradient(135deg, #2a1712, #1d1418); border: 1px solid #4a2a1e; }
.war-top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.war-top span { font-size: 12px; color: #ffb48a; font-weight: 700; letter-spacing: .08em; }
.war-top b { font-size: 28px; line-height: 1; font-family: var(--num); color: #ffd2a8; }
.war-top small { color: #b88a74; font-size: 12px; }
.war-top em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 700; color: #1b0d07; background: linear-gradient(90deg, #ffb84d, #ff6a3d); border-radius: 99px; padding: 2px 10px; }
.war .plus { position: absolute; right: 14px; top: -6px; font-style: normal; font-weight: 900; font-size: 20px; color: #ffcf5c; text-shadow: 0 2px 10px rgba(255,120,40,.8); animation: floatUp 1.6s ease-out both; }
.war.bump { animation: glow 1.4s ease-out; }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(10px) scale(.8); } 20% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-18px); } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(255,110,50,.0); } 30% { box-shadow: 0 0 22px 2px rgba(255,110,50,.55); } 100% { box-shadow: 0 0 0 0 rgba(255,110,50,0); } }
.meter.thick { height: 10px; }
.meter.fire.thick i { background: linear-gradient(90deg, #ffd166, #ff8a3d 50%, #ff3d3d); box-shadow: 0 0 10px rgba(255,90,40,.6); }
.tug-l { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--t-ink-2); margin-bottom: 4px; }
.tug-l span:first-child { color: #7fb0ff; font-weight: 700; } .tug-l span:last-child { color: #ffae6e; font-weight: 700; }
.tug-l span:nth-child(2) { color: var(--t-ink-3); text-align: center; }
.tug-bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--t-bg-2); }
.tug-bar .a { background: linear-gradient(90deg, #2c5cc5, #4d8cff); transition: width .5s; }
.tug-bar .b { background: linear-gradient(90deg, #ff9a4d, #d9532e); transition: width .5s; }
/* playback battle look */
.combo { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-radius: 10px; background: linear-gradient(90deg, #3a1a12, #261418); animation: pop .35s ease-out both; }
.combo b { font-size: 22px; font-style: italic; font-weight: 900; color: #ffcf5c; text-shadow: 0 0 12px rgba(255,120,40,.6); }
.combo span { font-size: 13px; color: #ffb48a; }
.ev { position: relative; }
.ev.duel { border-left: 3px solid #5a3a2a; }
.ev.duel.lv2 { border-left-color: #ff9a4d; } .ev.duel.lv3 { border-left-color: #ff4d4d; background: color-mix(in srgb, #ff4d4d 8%, var(--t-bg-2)); }
.ev.duel.lv3 { animation: pop .35s ease-out both, shake .4s .35s; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.ev .flag.lv1 { background: color-mix(in srgb, #ffd166 16%, transparent); color: #ffd166; }
.ev .flag.lv2 { background: color-mix(in srgb, #ff9a4d 18%, transparent); color: #ff9a4d; }
.ev .flag.lv3 { background: color-mix(in srgb, #ff4d4d 22%, transparent); color: #ff7a7a; }
.warchip { margin-left: auto; font-size: 11px; font-weight: 800; color: #ffcf5c; white-space: nowrap; }
.warchip.lv3 { color: #ff7a6b; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tile { background: var(--t-bg-2); border-radius: 10px; padding: 8px 10px; display: grid; gap: 1px; }
.tile small { font-size: 11px; color: var(--t-ink-3); }
.tile b { font-size: 22px; font-family: var(--num); line-height: 1.15; }
.tile span { font-size: 11px; color: var(--t-ink-3); }
.tile.fire b { color: #ffb24d; } .tile.warn b { color: #ff8b7b; } .tile.ok b { color: #6fdca6; }
/* briefing */
.modal.brief { max-width: 600px; }
.b-top { display: grid; gap: 6px; }
.b-lv { justify-self: start; font-size: 11px; font-weight: 800; letter-spacing: .14em; color: #1b0d07; background: var(--t-acc); border-radius: 4px; padding: 2px 8px; }
.b-top h2 { margin: 0; font-size: 28px; font-weight: 900; }
.b-top p { margin: 0; color: var(--t-ink-2); font-size: 14px; }
.b-vs { display: flex; align-items: stretch; border-radius: 12px; overflow: hidden; font-weight: 900; }
.b-vs span { flex: 1; text-align: center; padding: 14px 6px; font-size: 22px; color: #fff; }
.b-vs .sideA { background: linear-gradient(90deg, #2c5cc5, #3d7ff0); } .b-vs .sideB { background: linear-gradient(90deg, #f08a3c, #d9532e); }
.b-vs b { display: grid; place-items: center; padding: 0 12px; background: #141824; color: #ffe066; font-style: italic; font-size: 20px; }
.b-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.b-card { border-radius: 12px; padding: 10px 12px; background: var(--t-bg-2); display: grid; gap: 4px; align-content: start; }
.b-card h3 { margin: 0 0 2px; font-size: 13px; }
.b-card.win h3 { color: #6fdca6; } .b-card.lose h3 { color: #ff8b7b; }
.b-card p { margin: 0; font-size: 13px; color: var(--t-ink-2); }
.b-card b { color: var(--t-ink); }
.b-accs { display: grid; gap: 6px; }
.b-accs div { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--t-ink-3); }
.b-accs img { width: 30px; height: 30px; border-radius: 50%; image-rendering: pixelated; }
.b-accs b { color: var(--t-ink); margin-right: 8px; font-size: 13.5px; }
.go.go-lg { padding: 12px 24px; font-size: 15px; }
/* ending */
.end-head { display: flex; align-items: center; gap: 14px; }
.rank { width: 64px; height: 64px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 38px; font-weight: 900; font-style: italic; color: #1b0d07; animation: pop .5s ease-out both; }
.rank.rS { background: linear-gradient(135deg, #ffe066, #ff9a3d); box-shadow: 0 0 24px rgba(255,180,60,.6); }
.rank.rA { background: linear-gradient(135deg, #ffb3c7, #ff6f9a); } .rank.rB { background: linear-gradient(135deg, #9fd0ff, #5b8cff); }
.rank.rC { background: #8a93a6; } .rank.rD { background: #4a4f5c; color: #c9ced8; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.ach div { border-radius: 10px; padding: 7px 9px; background: var(--t-bg-2); opacity: .45; display: grid; gap: 1px; }
